<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Insulated copper rod between a hydrogen block and a radiating enclosure</title><desc id="desc">A copper rod with insulated sides conducts heat from its blackened exposed end toward hydrogen at its melting point. Surrounding walls are at 500 kelvin.</desc><rect width="720" height="300" fill="#fffdf7"/><rect x="25" y="92" width="145" height="125" rx="8" fill="#cbe5ed" stroke="#45656c" stroke-width="2"/><rect x="120" y="133" width="420" height="44" fill="#d69b63" stroke="#57422e" stroke-width="2"/><path d="M167 123H540 M167 187H540" stroke="#748f87" stroke-width="7" stroke-dasharray="10 5"/><path d="M540 133V177" stroke="#202e2d" stroke-width="9"/><path d="M655 115l-72 20 M655 155h-72 M655 195l-72-20" stroke="#d86e32" stroke-width="3" fill="none"/><path d="M580 135l10-8m-10 8l12 4 M580 155l11-6m-11 6l11 6 M580 175l12-4m-12 4l10 8" stroke="#d86e32" stroke-width="3" fill="none"/><g font-family="sans-serif" font-size="19" fill="#253c3d"><text x="38" y="115">H₂</text><text x="35" y="240">13.84 K</text><text x="265" y="157">Cu</text><text x="280" y="224">L = 0.200 m</text><text x="261" y="250">r = 0.0250 m</text><text x="560" y="69">500.0 K</text><text x="455" y="273">k = 1670 W/(m·K)</text></g></svg>
