<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Steel wires attached to a brass bar</title><desc id="desc">A heavy brass bar has a projection at each end. Two fine steel wires connect the projections and are parallel to the bar.</desc><rect width="720" height="300" fill="#fffdf7"/><path d="M150 105V80H570V105 M150 205V230H570V205" stroke="#547b86" stroke-width="4" fill="none"/><path d="M135 65H165V115H555V65H585V245H555V195H165V245H135Z" fill="#e2b66b" stroke="#5b4930" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#253c3d"><text x="298" y="163">brass / mässing</text><text x="289" y="54">steel / stål</text><text x="307" y="271">steel / stål</text></g></svg>
