<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Cross section of insulated steam pipe</title><desc id="desc">Concentric regions represent a steam pipe of radius two centimetres, cork from two to four centimetres, and foam from four to six centimetres. The inner surface is 140 degrees Celsius and outer surface 15 degrees Celsius.</desc><rect width="720" height="400" fill="#fffdf7"/><circle cx="260" cy="200" r="150" fill="#e5ebdd" stroke="#455b51" stroke-width="2"/><circle cx="260" cy="200" r="100" fill="#dab781" stroke="#725c42" stroke-width="2"/><circle cx="260" cy="200" r="50" fill="#f5d4b5" stroke="#725c42" stroke-width="2"/><path d="M260 200H410 M310 192v16 M360 192v16 M410 192v16" stroke="#344b4b" stroke-width="2"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="300" y="228">2 cm</text><text x="355" y="228">4 cm</text><text x="410" y="228">6 cm</text><text x="224" y="194">140 °C</text><text x="440" y="110">15 °C</text><text x="430" y="152">cork / kork</text><text x="430" y="180">2–4 cm</text><text x="430" y="270">foam / cellplast</text><text x="430" y="298">4–6 cm</text></g></svg>
