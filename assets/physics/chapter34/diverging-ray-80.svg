<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="title desc"><title id="title">Diverging lens ray construction</title><desc id="desc">An upright object is eight centimeters left of a diverging lens. A reduced upright virtual image forms three centimeters left of the lens. Dashed backward extensions of the refracted rays meet at the image.</desc>
