<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Object and enlarged upright image beside a lens</title><desc id="desc">An upright image is six centimetres left of the object. The object is sixteen centimetres left of the lens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M594 137.5H606V312.5H594Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M280 225V155" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M160 225V129" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M160 285H280 M280 285H600 M160 276V294 M280 276V294 M600 276V294" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="125" y="98">image</text><text x="250" y="130">object</text><text x="176" y="315">6.00 cm</text><text x="390" y="315">16.0 cm</text><text x="300" y="200">3.25 mm</text><text x="610" y="205">lens</text></g></svg>