<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A reflecting telescope</title><desc id="desc">Parallel incoming light reaches a concave mirror and the reflected image is viewed through an eyepiece.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M200 135.0Q222 225 200 315.0Q178 225 200 135.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M600 55Q670 225 600 395" fill="none" stroke="#536b67" stroke-width="6"/><path d="M55 160H630" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M630 160L200 230.76" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 230.76H55" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M55 290H630" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M630 290L200 219.24" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 219.24H55" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="156" y="345">eyepiece</text><text x="570" y="420">R = 1.28 m</text><text x="155" y="370">f = 1.60 cm</text></g></svg>