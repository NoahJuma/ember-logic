<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Converging and diverging zoom lenses</title><desc id="desc">Parallel rays converge at the first lens and are weakened by a diverging second lens before meeting at the final image. Dashed backward extensions locate the effective focal reference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M260 115.0Q282 225 260 335.0Q238 225 260 115.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M328 135.0Q350 225 328 315.0H352Q330 225 352 135.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M70 125H260L340 158.33L628 225" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M70 325H260L340 291.67L628 225" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M196 125L340 158.33 M196 325L340 291.67" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M260 360H340 M260 352V368 M340 352V368" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="628" cy="225" r="5" fill="#263f3b"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="245" y="100">f₁</text><text x="328" y="100">f₂ &lt; 0</text><text x="295" y="390">d</text><text x="185" y="215">Q</text><text x="635" y="220">I′</text><text x="75" y="120">r₀</text></g></svg>