<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A Galilean telescope</title><desc id="desc">A converging objective and diverging eyepiece convert a parallel incident bundle into a parallel emergent bundle. The eyepiece is inside the objective focal length.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M200 135.0Q222 225 200 315.0Q178 225 200 135.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M428 135.0Q450 225 428 315.0H452Q430 225 452 135.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M80 153H80 L200 165L440 239.53L620 353.42" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M80 273L200 285L440 258.47L620 372.36" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 75H485 M440 105H485 M200 67V83 M440 97V113 M485 67V113" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="260" y="65">f₁</text><text x="447" y="95">|f₂|</text><text x="150" y="350">objective</text><text x="405" y="350">eyepiece</text></g></svg>