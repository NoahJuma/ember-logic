<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>Plant and a principal ray</title><desc>A grid shows the object five squares from the lens. The given ray leaves the lens parallel to the axis; its backward extension crosses the axis nine squares from the lens.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e4e4df" stroke-width="1"/></pattern></defs><rect width="760" height="400" fill="#fffdf8"/><rect x="70" y="45" width="625" height="300" fill="url(#grid)"/><path d="M70 220H695" stroke="#666" stroke-width="1.5"/><rect x="410" y="60" width="20" height="280" fill="#e6f3f4" stroke="#236c78" stroke-width="2" stroke-dasharray="5 4"/><text x="414" y="190" font-family="sans-serif" font-size="18">?</text><path d="M295 220V170" fill="none" stroke="#233f77" stroke-width="3"  marker-end="url(#arrow)"/><text x="285" y="250" font-family="sans-serif" font-size="18">O</text><path d="M195 220L295 170" fill="none" stroke="#c4552f" stroke-width="3" stroke-dasharray="7 5" /><path d="M295 170L420 107.5H665" fill="none" stroke="#c4552f" stroke-width="3"  marker-end="url(#arrow)"/><text x="75" y="380" font-family="sans-serif" font-size="18">1 □ = 2 cm</text></svg>