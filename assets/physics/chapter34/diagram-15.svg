<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Seed in front of a spherical mirror</title><desc id="desc">A seed stands on the optical axis 15 centimetres in front of a thin spherical mirror shell, whose curvature radius is 12 centimetres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M575 75Q650 225 575 375" fill="none" stroke="#536b67" stroke-width="6"/><path d="M170 225V180" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 280H610 M170 272V288 M610 272V288" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="110" y="160">3.30 mm</text><text x="315" y="310">15.0 cm</text><text x="565" y="60">R = 12.0 cm</text></g></svg>