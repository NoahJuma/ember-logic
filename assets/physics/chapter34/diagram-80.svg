<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Object and upright image beside a lens</title><desc id="desc">An upright object is five centimetres left of its upright image. The image is three centimetres left of the lens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M594 137.5H606V312.5H594Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M200 225V125" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M450 225V187" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 285H450 M450 285H600 M200 276V294 M450 276V294 M600 276V294" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="155" y="110">object</text><text x="420" y="165">image</text><text x="230" y="315">5.00 cm</text><text x="490" y="315">3.00 cm</text><text x="120" y="205">6.50 mm</text><text x="610" y="205">lens</text></g></svg>