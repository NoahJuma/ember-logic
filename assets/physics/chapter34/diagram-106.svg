<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A tilted pencil and converging lens</title><desc id="desc">A 16-centimetre pencil is inclined 45 degrees upward to the right. Its centre is 15 centimetres above the optical axis and 45 centimetres left of the lens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 320H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M600 225.0Q622 320 600 415.0Q578 320 600 225.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M296.06 263.94L363.94 196.06" fill="none" stroke="#bb8749" stroke-width="8"/><path d="M330 230V320 M330 345H600 M330 337V353 M600 337V353" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="330" cy="230" r="5" fill="#263f3b"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="280" y="280">A</text><text x="370" y="190">B</text><text x="310" y="222">C</text><text x="340" y="280">15.0 cm</text><text x="445" y="375">45.0 cm</text><text x="368" y="220">45.0°</text><text x="575" y="205">f = 20.0 cm</text></g></svg>