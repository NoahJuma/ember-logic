<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Quinoline tube and luminous object</title><desc id="desc">A luminous circular object is immersed in quinoline below a convex top. Its real image appears at distance s prime above the top; the object distance is s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M250 140Q350 70 450 140V375Q350 405 250 375Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M250 140Q350 195 450 140" fill="none" stroke="#536b67" stroke-width="2"/><path d="M350 110V390" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M215 140V340 M208 140H222 M208 340H222 M500 140V385 M493 140H507 M493 385H507 M215 50V140 M208 50H222" fill="none" stroke="#536b67" stroke-width="2"/><ellipse cx="350" cy="340" rx="45" ry="12" fill="#e9a567" stroke="#536b67" stroke-width="2"/><ellipse cx="350" cy="50" rx="95" ry="20" fill="none" stroke="#ad488b" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="175" y="245">s</text><text x="170" y="105">s′</text><text x="510" y="270">H</text><text x="315" y="220">n = 1.627</text></g></svg>