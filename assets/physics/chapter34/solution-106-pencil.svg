<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" role="img" aria-labelledby="title desc"><title id="title">Tilted pencil and its image</title><desc id="desc">A pencil above the optical axis slopes upward to the right. Its real image is below the axis and slopes downward to the right.</desc><rect width="650" height="410" fill="#f8faf8"/><path d="M25 240H625" stroke="#9aada6" fill="none"/><path d="M320 55 Q305 240 320 390 Q335 240 320 55" fill="none" stroke="#29423b" stroke-width="4"/><path d="M66.7 193.3L123.3 136.7" stroke="#2a8460" stroke-width="5"/><path d="M485.25 270.5L523.4 346.8" stroke="#3974a1" stroke-width="5"/><g fill="#2a8460"><circle cx="66.7" cy="193.3" r="4"/><circle cx="95" cy="165" r="4"/><circle cx="123.3" cy="136.7" r="4"/></g><g fill="#3974a1"><circle cx="485.25" cy="270.5" r="4"/><circle cx="500" cy="300" r="4"/><circle cx="523.4" cy="346.8" r="4"/></g><g font-family="sans-serif" font-size="18" fill="#253e3a"><text x="48" y="213">A</text><text x="78" y="155">C</text><text x="129" y="133">B</text><text x="462" y="271">A′</text><text x="476" y="306">C′</text><text x="530" y="351">B′</text></g></svg>