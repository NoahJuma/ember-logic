<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img"><title>Converging lens: virtual image</title><desc>Light travels from right to left. Backward extensions of refracted rays locate an upright virtual image to the right.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="760" height="410" fill="#fffdf8"/><path d="M35 220H725" stroke="#777" stroke-width="1.5"/><path d="M400 85 Q365 220 400 355 Q435 220 400 85 Z" fill="#e6f3f4" stroke="#236c78" stroke-width="3"/><circle cx="256" cy="220" r="4" fill="#444"/><text x="251" y="245" font-family="sans-serif" font-size="18">F</text><circle cx="544" cy="220" r="4" fill="#444"/><text x="539" y="245" font-family="sans-serif" font-size="18">F</text><path d="M484.4 220V180" fill="none" stroke="#233f77" stroke-width="3"  marker-end="url(#arrow)"/><path d="M604 220V123.3" fill="none" stroke="#b44f6c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M484.4 180H400L220 230" fill="none" stroke="#c4552f" stroke-width="3"  marker-end="url(#arrow)"/><path d="M400 180L604 123.3" fill="none" stroke="#c4552f" stroke-width="3" stroke-dasharray="7 5" /><path d="M484.4 180L220 305.3" fill="none" stroke="#347c55" stroke-width="3"  marker-end="url(#arrow)"/><path d="M484.4 180L604 123.3" fill="none" stroke="#347c55" stroke-width="3" stroke-dasharray="7 5" /><text x="478" y="260" font-family="sans-serif" font-size="18" fill="#333">O</text><text x="600" y="260" font-family="sans-serif" font-size="18" fill="#333">I</text></svg>