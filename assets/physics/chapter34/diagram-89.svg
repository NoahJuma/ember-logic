<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Candle between mirror and lens</title><desc id="desc">A candle stands at the center of curvature of a concave mirror. A converging lens lies 85 centimetres to its right.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M50 225H700" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M145 80Q85 225 145 370" fill="none" stroke="#536b67" stroke-width="6"/><path d="M245 225V160" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#arrow)"/><path d="M670 135.0Q692 225 670 315.0Q648 225 670 135.0Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M245 315H670 M245 307V323 M670 307V323" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="100" y="68">f = 10.0 cm</text><text x="226" y="145">C</text><text x="400" y="345">85.0 cm</text><text x="600" y="80">f = 32.0 cm</text></g></svg>