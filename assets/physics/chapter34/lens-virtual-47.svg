<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" role="img" aria-labelledby="title desc">
<title id="title">Virtual image formed by a converging lens</title><desc id="desc">A converging lens has focal points at distance f. An upright object of height h is placed two-thirds of f to the left of the lens. Rays diverge to the right, while their dashed backward extensions meet at an upright virtual image of height 3h, two focal lengths to the left of the lens.</desc>
<defs><marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a02980"/></marker><marker id="obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#235b6a"/></marker><marker id="image" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#866093"/></marker></defs>
<rect width="690" height="330" rx="16" fill="#f4f8f5"/><path d="M45 240H650" fill="none" stroke="#506967" stroke-width="1.5"/>
<path d="M400 45 Q376 140 400 300 Q424 140 400 45Z" fill="#d9e9ea" stroke="#24646c" stroke-width="2"/>
<g fill="#345756"><circle cx="280" cy="240" r="4"/><circle cx="520" cy="240" r="4"/></g>
<path d="M320 240V200" stroke="#235b6a" stroke-width="3" fill="none" marker-end="url(#obj)"/><path d="M160 240V120" stroke="#866093" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#image)"/>
<g stroke="#a02980" stroke-width="2.5" fill="none"><path d="M320 200H400L620 273.33" marker-end="url(#ray)"/><path d="M320 200L500 290" marker-end="url(#ray)"/><path d="M160 120L400 200M160 120L320 200" stroke-dasharray="6 5"/></g>
<path d="M320 272v11M400 272v11M320 277.5H400" fill="none" stroke="#506967" stroke-width="1.5"/><g fill="#193f40" font-family="sans-serif" font-size="18"><text x="271" y="265">F</text><text x="513" y="265">F′</text><text x="325" y="197">h</text><text x="127" y="115">3h</text><text x="338" y="302">2f/3</text><text x="160" y="265">−2f</text></g>
</svg>
