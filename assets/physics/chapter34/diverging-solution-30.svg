<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Diverging lens ray construction</title><desc id="desc">A parallel ray emerges diverging as if from the left focal point. Its dashed backward extension intersects the central ray at the upright virtual image.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="760" height="360" fill="#fffdf8"/><path d="M40 200H720" stroke="#777" stroke-width="1.5"/><path d="M430 70 Q450 200 430 330 L470 330 Q450 200 470 70 Z" fill="#e6f3f4" stroke="#236c78" stroke-width="3"/><path d="M370 200V120" stroke="#233f77" stroke-width="4" marker-end="url(#arrow)"/><path d="M390 200V140" stroke="#b44f6c" stroke-width="4" marker-end="url(#arrow)"/><circle cx="210" cy="200" r="4" fill="#444"/><text x="200" y="225" font-family="sans-serif" font-size="18">F</text><text x="338" y="250" font-family="sans-serif" font-size="16">s = 16 cm</text><text x="378" y="280" font-family="sans-serif" font-size="16">s′ = −12 cm</text><path d="M370 120H450L690 40" fill="none" stroke="#c4552f" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 120L210 200" fill="none" stroke="#c4552f" stroke-width="2" stroke-dasharray="7 5"/><path d="M370 120L550 300" fill="none" stroke="#347c55" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="105" font-family="sans-serif" font-size="16" fill="#233f77">O</text><text x="287" y="165" font-family="sans-serif" font-size="16" fill="#b44f6c">I</text>
</svg>
