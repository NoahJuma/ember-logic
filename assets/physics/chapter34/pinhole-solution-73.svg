<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>Pinhole camera ray construction</title><desc>Rays from the top and bottom of the object cross at the aperture and form an inverted image on the film.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e4e4df" stroke-width="1"/></pattern></defs><rect width="760" height="400" fill="#fffdf8"/><path d="M400 60V196 M400 204V340 H630 V60 H400" fill="none" stroke="#333" stroke-width="4"/><path d="M630 65V335" stroke="#754e9b" stroke-width="6"/><path d="M140 270V110" fill="none" stroke="#233f77" stroke-width="3"  marker-end="url(#arrow)"/><text x="115" y="300" font-family="sans-serif" font-size="18">O</text><path d="M630 138V280" fill="none" stroke="#b44f6c" stroke-width="3"  marker-end="url(#arrow)"/><text x="650" y="300" font-family="sans-serif" font-size="18">I</text><path d="M140 110L630 280" fill="none" stroke="#c4552f" stroke-width="3"  marker-end="url(#arrow)"/><path d="M140 270L630 138" fill="none" stroke="#347c55" stroke-width="3"  marker-end="url(#arrow)"/></svg>