<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Spherical glass shell and four refracting surfaces</title><desc id="desc">A cross-section of a hollow spherical shell has outer radius 4.00 centimetres and inner radius 3.40 centimetres. Parallel rays approach from the left; surfaces 1 to 4 are ordered from left to right.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="430" rx="14" fill="#fbf8f1"/><circle cx="350" cy="205" r="140" fill="#bed9ca" stroke="#527a68" stroke-width="3"/><circle cx="350" cy="205" r="119" fill="#fbf8f1" stroke="#527a68" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M50 205H650" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M55 165H195" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 245H195" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 205V65 M350 205L445 133" fill="none" stroke="#315b60" stroke-width="2"/><circle cx="350" cy="205" r="4" fill="#315b60"/><text x="200" y="195">1</text><text x="228" y="195">2</text><text x="460" y="195">3</text><text x="490" y="195">4</text><text x="655" y="212">x</text><text x="360" y="60">4.00 cm</text><text x="500" y="130">3.40 cm</text><text x="60" y="300">parallel / parallella</text><text x="215" y="390" font-size="17">cross-section / tvärsnitt · schematic / schematisk</text></g></svg>
