<title id="title">Two zoom-lens configurations</title><desc id="desc">Parallel rays enter a converging lens and then a diverging lens. In case a the lenses are 4 centimeters apart and the final image is 24 centimeters beyond the second lens. In case b the separation is 8 centimeters and the final image is 6 centimeters beyond the second lens. Each panel uses its own horizontal scale.</desc>
