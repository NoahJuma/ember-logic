<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Converging lens virtual image</title><desc id="desc">A source sixteen centimeters to the left of a converging lens forms an upright virtual image twenty-two centimeters to the left. Backward extensions of the refracted rays meet at the image.</desc>
