<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Potential around the circuit</title><desc id="desc">Starting at b as zero volts and following the counterclockwise current, potential rises by 16 volts across the ideal source then falls across the 1.6, 5.0 and 1.4 ohm resistances, the 8.0 volt source, and the 9.0 ohm resistor back to zero.</desc><rect width="760" height="430" rx="16" fill="#f4f7f4"/><g stroke="#d8e3df" stroke-width="1"><path d="M90 330 H700 M90 243 H700 M90 156 H700 M90 69 H700"/></g><g stroke="#263d42" stroke-width="3" fill="none"><path d="M90 40 V330 H710"/></g><path d="M100 330 L180 330 L180 52 L265 65 L350 106 L435 117 L435 256 L540 330 L660 330" fill="none" stroke="#236b77" stroke-width="4"/><g fill="#183239" font-family="sans-serif" font-size="18"><text x="16" y="30">V (V)</text><text x="65" y="336">0</text><text x="65" y="249">5</text><text x="55" y="162">10</text><text x="55" y="75">15</text><text x="102" y="360">b</text><text x="205" y="47">+16 V</text><text x="252" y="95">a</text><text x="405" y="100">−8 V</text><text x="528" y="315">b</text><text x="120" y="400">b → ε₁ → 1.6 Ω → 5 Ω → 1.4 Ω → ε₂ → 9 Ω → b</text></g></svg>
