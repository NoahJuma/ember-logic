<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Two-source circuit</title><desc id="desc">A single loop contains two sources, each with internal resistance, and 5.0 and 9.0 ohm resistors. Source polarities are shown beside the battery symbols.</desc><rect width="640" height="380" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M100 80 H200 M280 80 H365 M385 80 H540 V150 M540 230 V300 H385 M365 300 H280 M200 300 H100 V230 M100 150 V80"/><path d="M200 80 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12 M200 300 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12 M100 150 l-12 10 l24 14 l-24 14 l24 14 l-24 14 l12 10 v4 M540 150 l-12 10 l24 14 l-24 14 l24 14 l-24 14 l12 10 v4" stroke="#a44e39" stroke-width="4"/><g stroke="#236b77" stroke-width="4"><path d="M365 58 V102 M385 45 V115"/><path d="M365 265 V335 M385 278 V322"/></g></g><g fill="#263d42" font-family="sans-serif" font-size="21" text-anchor="middle"><circle cx="160" cy="80" r="4"/><circle cx="470" cy="80" r="4"/><circle cx="540" cy="270" r="4"/><text x="160" y="115">a</text><text x="470" y="115">b</text><text x="570" y="278">c</text><text x="240" y="52">1.6 Ω</text><text x="375" y="25">16.0 V</text><text x="240" y="348">1.4 Ω</text><text x="375" y="365">8.0 V</text><text x="57" y="195">5.0 Ω</text><text x="590" y="195">9.0 Ω</text><text x="389" y="49">+</text><text x="356" y="270">+</text></g></svg>