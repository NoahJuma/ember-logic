<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Expanding spherical surface</title><desc id="desc">Two points on a spherical surface are separated by a central angle of sixty degrees. Their surface distance follows the arc, and the sphere radius increases with time.</desc><rect width="820" height="450" fill="#fffdf7"/><circle cx="400" cy="225" r="170" fill="#d6e7ee" stroke="#5383a2" stroke-width="3"/><path d="M400 225L400 55 M400 225L253 140" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M400 55 A170 170 0 0 0 253 140" fill="none" stroke="#ad488b" stroke-width="7"/><path d="M400 175 A50 50 0 0 0 357 200" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="400" cy="55" r="7" fill="#ad488b"/><circle cx="253" cy="140" r="7" fill="#ad488b"/><circle cx="400" cy="225" r="4" fill="#263f3b"/><g font-family="sans-serif" font-size="22" fill="#263f3b"><text x="380" y="215">60°</text><text x="280" y="82">D(t)</text><text x="408" y="150">R(t)</text><text x="410" y="50">A</text><text x="220" y="135">B</text></g></svg>
