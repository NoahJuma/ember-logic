<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">Hyperon decay and a separate pion decay</title><desc id="desc">A hyperon at rest decays into a neutron and neutral pion with opposite momenta. Separately, a stationary neutral pion emits two photons; one photon is redshifted as the universe expands.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="350" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><text x="40" y="50">(a) Λ⁰ at rest / i vila</text><circle cx="350" cy="115" r="23" fill="#dcebe1"/><text x="335" y="122">Λ⁰</text><path d="M325 115H160" stroke="#315b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M375 115H540" stroke="#315b60" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="123">n</text><text x="560" y="123">π⁰</text><text x="40" y="205">(b) separate π⁰ at rest / separat π⁰ i vila</text><circle cx="215" cy="270" r="22" fill="#dcebe1"/><text x="202" y="277">π⁰</text><path d="M190 270H90" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M240 270H510" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="250">γ</text><text x="535" y="278">γ</text><text x="310" y="250">a_emit/a_now = 0.12</text></g></svg>
