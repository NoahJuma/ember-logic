<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charged semicircle</title><desc id="desc">A semicircle above the x axis carries positive Q on its left half and negative Q on its right half.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M100 290L620 290"/><path d="M360 65L360 330"/><path d="M360 290L220 150"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="145" y="180">+Q</text><text x="545" y="180">−Q</text><text x="265" y="207">a</text><text x="625" y="298">x</text><text x="370" y="65">y</text></g><path d="M160 290 A200 200 0 0 1 360 90" stroke="#d7645c" stroke-width="7" fill="none"/><path d="M360 90 A200 200 0 0 1 560 290" stroke="#618bc6" stroke-width="7" fill="none"/></svg>