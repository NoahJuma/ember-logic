<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charges connected by an insulating wire</title><desc id="desc">The negative charge is on the left, the fixed positive charge on the right, and the uniform electric field points right.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M150 220L560 220"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="130" y="260">−6.50 μC</text><text x="507" y="260">+8.75 μC</text><text x="310" y="208">2.50 cm</text><text x="325" y="125">E</text></g><circle cx="150" cy="220" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="227" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text><circle cx="560" cy="220" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="560" y="227" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><path d="M270 140L430 140" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>