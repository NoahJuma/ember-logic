<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two source fields at one point</title><desc id="desc">Two positive point charges are below point P. Individual field vectors at P point upward and to opposite sides.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><circle cx="190" cy="300" r="11" fill="#d7645c" stroke="#455b51" stroke-width="2"/><circle cx="530" cy="300" r="11" fill="#d7645c" stroke="#455b51" stroke-width="2"/><circle cx="360" cy="200" r="5" fill="#263c3a" stroke="#455b51" stroke-width="2"/><path d="M355 195L240 80" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#a)"/><path d="M365 195L480 80" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="178" y="335">q₁</text><text x="516" y="335">q₂</text><text x="348" y="216">P</text><text x="245" y="95">E₂</text><text x="454" y="95">E₁</text></g></svg>