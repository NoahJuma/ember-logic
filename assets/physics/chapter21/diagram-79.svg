<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A uniformly charged rod and a point charge</title><desc id="desc">A positive rod extends on the x axis from zero to a; point charge q lies to the right at a plus r.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M80 230L650 230"/><path d="M150 100L150 300"/><path d="M150 275L390 275"/><path d="M390 275L530 275"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="120" y="320">O</text><text x="260" y="206">Q</text><text x="254" y="302">a</text><text x="455" y="302">r</text><text x="515" y="190">q</text><text x="655" y="237">x</text><text x="137" y="90">y</text></g><path d="M150 230H390" stroke="#d7645c" stroke-width="12"/><circle cx="530" cy="230" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="530" y="237" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text></svg>