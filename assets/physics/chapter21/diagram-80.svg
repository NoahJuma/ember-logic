<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A charged vertical rod and a negative point charge</title><desc id="desc">A positive rod runs from the origin up to y equals a. A negative charge lies on the positive x axis.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M150 75L150 315"/><path d="M100 280L650 280"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="120" y="304">O</text><text x="120" y="110">a</text><text x="175" y="175">Q</text><text x="485" y="318">−q</text><text x="655" y="287">x</text><text x="140" y="65">y</text></g><path d="M150 280V110" stroke="#d7645c" stroke-width="12"/><circle cx="500" cy="280" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="500" y="287" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text></svg>