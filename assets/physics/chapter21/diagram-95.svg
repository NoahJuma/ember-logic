<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Three charges on a right triangle</title><desc id="desc">Charges q one and q two are five centimetres apart. Charge q three lies four centimetres from q one and three from q two. The total force on q three points left.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M120 306L570 306"/><path d="M120 306L408 90"/><path d="M570 306L408 90"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="90" y="340">q₁</text><text x="570" y="340">q₂</text><text x="438" y="75">q₃ = +4.00 μC</text><text x="260" y="340">5.00 cm</text><text x="210" y="178">4.00 cm</text><text x="485" y="185">3.00 cm</text><text x="315" y="75">F</text></g><circle cx="120" cy="306" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="120" y="313" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="570" cy="306" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="570" y="313" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="408" cy="90" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="408" y="97" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><path d="M400 90L305 90" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>