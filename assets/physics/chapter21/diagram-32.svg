<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Electric field from two vertically separated charges</title><desc id="desc">The unknown charge Q is above the positive charge q. Point P lies to the right of their midpoint, and the net electric field at P is upward.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M250 90L250 310" stroke-dasharray="6 5"/><path d="M250 200L490 200" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="225" y="72">Q</text><text x="218" y="344">+q</text><text x="495" y="224">P</text><text x="195" y="150">d</text><text x="195" y="270">d</text><text x="505" y="140">E</text></g><circle cx="250" cy="90" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="250" y="97" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="250" cy="310" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="250" y="317" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><circle cx="490" cy="200" r="14" fill="#263c3a" stroke="#485e59" stroke-width="2"/><text x="490" y="207" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><path d="M490 190L490 105" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>