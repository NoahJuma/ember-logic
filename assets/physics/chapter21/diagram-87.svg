<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A charged annular disk</title><desc id="desc">An annulus in the yz plane has inner radius R one and outer radius R two; its symmetry axis is x.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><ellipse cx="350" cy="250" rx="220" ry="65" fill="#d7e9e5" stroke="#455b51" stroke-width="3"/><ellipse cx="350" cy="250" rx="70" ry="21" fill="#fffdf7" stroke="#455b51" stroke-width="3"/><path d="M350 330V65" fill="none" stroke="#455b51" stroke-width="2"/><path d="M115 250H615" fill="none" stroke="#455b51" stroke-width="2"/><path d="M350 250L470 185" fill="none" stroke="#455b51" stroke-width="2"/><path d="M130 320H350 M280 292H350" fill="none" stroke="#455b51" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="345" y="55">x</text><text x="620" y="263">y</text><text x="477" y="176">z</text><text x="260" y="238">σ</text><text x="263" y="333">R₂</text><text x="339" y="305">R₁</text><text x="360" y="290">O</text></g></svg>