<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two charges and their electric field at P</title><desc id="desc">Point P is five centimetres from q one, twelve centimetres from q two, and the charges are thirteen centimetres apart. The net field at P points downward.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M130 300L650 300"/><path d="M130 300L207 115"/><path d="M650 300L207 115"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="98" y="334">q₁</text><text x="650" y="334">q₂</text><text x="199" y="95">P</text><text x="130" y="195">5.0 cm</text><text x="430" y="180">12.0 cm</text><text x="340" y="334">13.0 cm</text><text x="225" y="173">E</text></g><circle cx="130" cy="300" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="130" y="307" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="650" cy="300" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="650" y="307" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="207" cy="115" r="14" fill="#263c3a" stroke="#485e59" stroke-width="2"/><text x="207" y="122" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><path d="M207 130L207 215" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>