<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charged particle deflection between plates</title><desc id="desc">A particle enters a 26 centimetre long field region with horizontal velocity; the field points down, and a screen is 56 centimetres beyond the plates.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M150 125L420 125"/><path d="M150 275L420 275"/><path d="M600 95L600 305"/><path d="M120 200L600 200" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="200" y="105">26.0 cm</text><text x="475" y="105">56.0 cm</text><text x="67" y="205">q, m</text><text x="430" y="205">E</text><text x="570" y="253">d</text><text x="150" y="183">v₀</text></g><circle cx="115" cy="200" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="115" y="207" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><path d="M145 200L205 200" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M215 150L215 245" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M310 150L310 245" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M400 150L400 245" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/><circle cx="600" cy="250" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="600" y="257" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text></svg>