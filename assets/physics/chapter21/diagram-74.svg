<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two oppositely charged suspended spheres</title><desc id="desc">Two spheres hang from the same point in a horizontal electric field directed left. The angle between the threads is 50 degrees.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M360 45L230 300"/><path d="M360 45L490 300"/><path d="M360 45L360 185" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="275" y="165">L</text><text x="435" y="165">L</text><text x="325" y="135">50.0°</text><text x="345" y="355">E</text></g><circle cx="230" cy="300" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="230" y="307" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="490" cy="300" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="490" y="307" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><path d="M465 340L255 340" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>