<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two point charges on the x axis</title><desc id="desc">A positive charge lies at the origin and a negative charge at x equals 0.600 metres.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M80 200L650 200"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="200" y="170">+2.50 μC</text><text x="423" y="170">−3.50 μC</text><text x="245" y="240">0</text><text x="463" y="240">0.600 m</text><text x="655" y="207">x</text></g><circle cx="250" cy="200" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="250" y="207" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><circle cx="470" cy="200" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="470" y="207" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text></svg>