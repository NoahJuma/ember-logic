<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" role="img" aria-labelledby="title desc">
<title id="title">Oppositely charged halves of a rod</title><desc id="desc">A vertical rod on the y axis carries positive charge from zero to a and negative charge from zero to minus a. Point P lies on the positive x axis.</desc>
<defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#405e55"/></marker></defs>
<rect width="580" height="420" rx="14" fill="#fbfaf6"/>
<g fill="none" stroke="#58766d" stroke-width="2.2" marker-end="url(#ax)"><path d="M65 210 H525"/><path d="M220 370 V45"/></g>
<path d="M220 210 V90" stroke="#bf6043" stroke-width="12"/><path d="M220 210 V330" stroke="#3b7999" stroke-width="12"/>
<circle cx="430" cy="210" r="5" fill="#263b39"/>
<g font-family="system-ui,sans-serif" font-size="20" fill="#263b39"><text x="532" y="217">x</text><text x="212" y="38">y</text><text x="234" y="93">+a</text><text x="234" y="340">−a</text><text x="438" y="200">P</text><text x="239" y="157">+Q</text><text x="239" y="285">−Q</text><text x="204" y="235">0</text></g>
</svg>
