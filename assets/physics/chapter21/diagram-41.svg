<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two electrons and a proton</title><desc id="desc">Both electrons are equally distant from the proton and subtend an angle of 65 degrees at the proton.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M150 320L420 320" stroke-dasharray="6 5"/><path d="M150 320L264 75" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="115" y="360">p⁺</text><text x="425" y="355">e⁻</text><text x="270" y="60">e⁻</text><text x="220" y="285">65.0°</text><text x="225" y="360">1.50×10⁻¹⁰ m</text></g><circle cx="150" cy="320" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="150" y="327" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><circle cx="420" cy="320" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="420" y="327" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text><circle cx="264" cy="75" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="264" y="82" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text></svg>