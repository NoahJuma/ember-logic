<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Three charges and acceleration</title><desc id="desc">Two fixed charges are separated vertically. Charge Q lies to their left and is equally distant from both; its acceleration points up.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M440 85L440 335" stroke-dasharray="6 5"/><path d="M334 210L440 85" stroke-dasharray="6 5"/><path d="M334 210L440 335" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="450" y="80">q₁</text><text x="450" y="360">q₂</text><text x="263" y="220">Q</text><text x="340" y="125">3.00 cm</text><text x="340" y="310">3.00 cm</text><text x="450" y="220">4.50 cm</text><text x="270" y="135">a</text></g><circle cx="440" cy="85" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="440" y="92" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="440" cy="335" r="14" fill="#d3a76d" stroke="#485e59" stroke-width="2"/><text x="440" y="342" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text><circle cx="334" cy="210" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="334" y="217" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text><path d="M300 205L300 130" stroke="#08788a" stroke-width="3" fill="none" marker-end="url(#ar)"/></svg>