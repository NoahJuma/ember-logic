<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Cytosine and guanine charge-chain model</title><desc id="desc">Three parallel charge chains. The upper is O minus, H plus, O minus with H bonded on the left; the middle is N minus, H plus, N minus and the lower O minus, H plus, N minus, with H bonded on the right.</desc><rect width="720" height="380" fill="#fffdf7"/><g stroke="#50645c" stroke-width="3" fill="none"><path d="M150 100H301.7"/><path d="M301.7 100H550" stroke-dasharray="7 6"/><path d="M150 205H403.3" stroke-dasharray="7 6"/><path d="M403.3 205H550"/><path d="M150 310H398.3" stroke-dasharray="7 6"/><path d="M398.3 310H550"/></g><g font-family="sans-serif" font-size="20" fill="#263c3a"><text x="305" y="65">0.290 nm</text><text x="305" y="170">0.300 nm</text><text x="305" y="275">0.290 nm</text><text x="65" y="52">Cytosine</text><text x="442" y="52">Guanine</text><text x="235" y="362">H–N / O–H = 0.110 nm</text></g><circle cx="150" cy="100" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="107" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">O−</text><circle cx="301.72413793103453" cy="100" r="23" fill="#d97264" stroke="#485e59" stroke-width="2"/><text x="301.72413793103453" y="107" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">H+</text><circle cx="550" cy="100" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="550" y="107" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">O−</text><circle cx="150" cy="205" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="212" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text><circle cx="403.3333333333333" cy="205" r="23" fill="#d97264" stroke="#485e59" stroke-width="2"/><text x="403.3333333333333" y="212" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">H+</text><circle cx="550" cy="205" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="550" y="212" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text><circle cx="150" cy="310" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="317" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">O−</text><circle cx="398.27586206896547" cy="310" r="23" fill="#d97264" stroke="#485e59" stroke-width="2"/><text x="398.27586206896547" y="317" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">H+</text><circle cx="550" cy="310" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="550" y="317" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text></svg>