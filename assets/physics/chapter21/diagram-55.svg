<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Dipole and third charge</title><desc id="desc">A positive and a negative five-microcoulomb charge are separated vertically by three centimetres. The negative ten-microcoulomb charge is two centimetres from each.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M200 80L200 320" stroke-dasharray="6 5"/><path d="M200 80L306 200" stroke-dasharray="6 5"/><path d="M200 320L306 200" stroke-dasharray="6 5"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="145" y="66">+5.00 μC</text><text x="145" y="357">−5.00 μC</text><text x="320" y="206">−10.00 μC</text><text x="115" y="205">3.00 cm</text><text x="245" y="130">2.00 cm</text><text x="245" y="298">2.00 cm</text></g><circle cx="200" cy="80" r="14" fill="#d7645c" stroke="#485e59" stroke-width="2"/><text x="200" y="87" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">+</text><circle cx="200" cy="320" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="200" y="327" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text><circle cx="306" cy="200" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="306" y="207" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text></svg>