<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charged ball suspended next to a wall</title><desc id="desc">A ball hangs to the right of a vertical wall from a string making an angle of 17.4 degrees with the wall.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M230 45L230 350"/><path d="M230 65L320 320"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="180" y="210">17.4°</text><text x="338" y="326">−1.10 μC</text><text x="329" y="350">13.0 g</text></g><circle cx="320" cy="320" r="14" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="320" y="327" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff">−</text></svg>