<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc"><title id="title">Electric field of a positively charged semicircle</title><desc id="desc">A uniformly positively charged upper semicircle of radius a is centered at the origin. A charge element at angle theta produces a field at the center pointing away from the element.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="390" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M85 250H530" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 335V55" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M140 250A160 160 0 0 1 460 250" fill="none" stroke="#c4564c" stroke-width="6"/><path d="M300 250L413 137" fill="none" stroke="#7a9287" stroke-width="2"/><circle cx="413" cy="137" r="6" fill="#c4564c"/><path d="M300 250L250 300" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 250A50 50 0 0 0 335 215" fill="none" stroke="#315b60" stroke-width="2"/><circle cx="300" cy="250" r="4" fill="#315b60"/><text x="538" y="257">x</text><text x="286" y="46">y</text><text x="350" y="230">θ</text><text x="365" y="188">a</text><text x="423" y="130">dq</text><text x="205" y="315">dE</text><text x="160" y="110">+Q</text></g></svg>
