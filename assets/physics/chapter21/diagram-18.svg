<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Thymine and adenine charge-chain model</title><desc id="desc">The upper chain is O minus, H plus, N minus with H bonded to the right atom. The lower chain is N minus, H plus, N minus with H bonded to the left atom.</desc><rect width="720" height="380" fill="#fffdf7"/><g stroke="#50645c" stroke-width="3" fill="none"><path d="M150 135H392.9" stroke-dasharray="7 6"/><path d="M392.9 135H550"/><path d="M150 280H296.7"/><path d="M296.7 280H550" stroke-dasharray="7 6"/></g><g font-family="sans-serif" font-size="20" fill="#263c3a"><text x="305" y="100">0.280 nm</text><text x="305" y="245">0.300 nm</text><text x="65" y="52">Thymine</text><text x="442" y="52">Adenine</text><text x="235" y="362">H–N = 0.110 nm</text></g><circle cx="150" cy="135" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">O−</text><circle cx="392.8571428571429" cy="135" r="23" fill="#d97264" stroke="#485e59" stroke-width="2"/><text x="392.8571428571429" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">H+</text><circle cx="550" cy="135" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="550" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text><circle cx="150" cy="280" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="150" y="287" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text><circle cx="296.6666666666667" cy="280" r="23" fill="#d97264" stroke="#485e59" stroke-width="2"/><text x="296.6666666666667" y="287" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">H+</text><circle cx="550" cy="280" r="23" fill="#618bc6" stroke="#485e59" stroke-width="2"/><text x="550" y="287" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">N−</text></svg>