<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Perpendicular charged rods</title><desc id="desc">A positive horizontal rod and a negative vertical rod meet at a right angle. Point P is on both perpendicular bisectors.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="720" height="400" fill="#fffdf7"/><g stroke="#48605c" fill="none" stroke-width="2"><path d="M190 75L190 315"/><path d="M190 75L430 75"/></g><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="245" y="58">+2.50 μC</text><text x="55" y="200">−2.50 μC</text><text x="265" y="235">P</text><text x="245" y="350">1.20 m</text></g><path d="M190 75H430" stroke="#d7645c" stroke-width="12"/><path d="M190 75V315" stroke="#618bc6" stroke-width="12"/><circle cx="310" cy="195" r="14" fill="#263c3a" stroke="#485e59" stroke-width="2"/><text x="310" y="202" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#fff"></text></svg>