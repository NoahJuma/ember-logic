<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Piston above ideal gas</title><desc id="desc">A frictionless piston of mass m and radius r sits at height h above an ideal gas. Outside air pressure p zero acts above the piston.</desc><rect width="720" height="400" fill="#fffdf7"/><path d="M200 60V330H430V60" fill="#dcefe3" stroke="#3a5350" stroke-width="4"/><path d="M202 60H428V175H202Z" fill="#f5f2ea"/><rect x="202" y="175" width="226" height="38" fill="#e9aa70" stroke="#654a3a" stroke-width="3"/><path d="M315 175H430 M315 169v12 M430 169v12 M465 213V330 M455 213h20 M455 330h20" stroke="#506e6d" stroke-width="2"/><g font-family="sans-serif" font-size="20" fill="#253c3d"><text x="267" y="115">p₀</text><text x="340" y="165">r</text><text x="445" y="198">m</text><text x="477" y="276">h</text><text x="260" y="275">ideal gas</text></g></svg>
