<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Gas supporting a movable disk</title><desc id="desc">A frictionless disk of mass three kilograms rests on gas in a vertical cylinder in p_ext = 0. The initial gas height is four metres. A nine-kilogram block is then placed on the disk and the gas is allowed to reach a new equilibrium at the same temperature.</desc><rect width="820" height="450" fill="#fffdf7"/><g stroke="#536b67" stroke-width="3" fill="none"><path d="M120 80V370H330V80 M490 80V370H700V80"/><path d="M120 190H330 M490 270H700" stroke-width="10"/><path d="M95 190V370 M85 190H105 M85 370H105 M730 270V370 M720 270H740 M720 370H740"/></g><rect x="125" y="196" width="200" height="169" fill="#d7e8e8"/><rect x="495" y="276" width="200" height="89" fill="#d7e8e8"/><rect x="565" y="210" width="60" height="55" fill="#e9bf7c" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="140" y="165">3.00 kg</text><text x="560" y="200">9.00 kg</text><text x="20" y="290">4.00 m</text><text x="738" y="325">h₂</text><text x="180" y="290">gas</text><text x="550" y="335">gas</text><text x="315" y="60">p_ext = 0</text><text x="245" y="420">T₁ = T₂</text></g></svg>
