<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="title desc"><title id="title">Bar suspended from two wires</title><desc id="desc">A horizontal uniform bar of weight 165 newtons hangs from identical vertical wires A and B. A cube of weight 185 newtons rests three quarters of the distance from A to B. The wires are 75.0 centimetres long and have mass 5.50 grams each.</desc><rect width="780" height="450" fill="#fffdf7"/><path d="M140 90H640 M175 90V310 M605 90V310" fill="none" stroke="#536b67" stroke-width="3"/><path d="M175 310H605" fill="none" stroke="#bb8749" stroke-width="12"/><rect x="480" y="265" width="35" height="39" fill="#e9bf7c" stroke="#536b67" stroke-width="2"/><path d="M175 360H497 M175 350V370 M497 350V370" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="21" fill="#263f3b"><text x="150" y="205">A</text><text x="615" y="205">B</text><text x="285" y="390">3AB/4</text><text x="480" y="250">185 N</text><text x="300" y="335">165 N</text><text x="210" y="130">L = 0.750 m; m = 5.50 g</text></g></svg>
