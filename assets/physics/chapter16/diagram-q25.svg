<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="title desc"><title id="title">Supersonic aircraft and observers</title><desc id="desc">A supersonic aircraft travels left. Its shock cone touches ground observer B; observer A is ahead of the cone and C is behind B.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="780" height="450" fill="#fffdf7"/><path d="M80 345H700" fill="none" stroke="#536b67" stroke-width="3"/><path d="M280 160L400 345 M280 160L400 35" fill="none" stroke="#5383a2" stroke-width="4"/><path d="M280 160H445L490 145L475 160L490 175L445 160" fill="#e9bf7c" stroke="#536b67" stroke-width="2"/><path d="M270 160H150" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g fill="#263f3b"><circle cx="170" cy="345" r="6"/><circle cx="400" cy="345" r="6"/><circle cx="635" cy="345" r="6"/></g><g font-family="sans-serif" font-size="22" fill="#263f3b"><text x="160" y="380">A</text><text x="390" y="380">B</text><text x="625" y="380">C</text><text x="170" y="145">M &gt; 1</text></g></svg>
