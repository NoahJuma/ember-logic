<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Tunnelling through an oxide gap</title><desc id="desc">Two copper wires of diameter one millimetre face each other across an oxide gap of width one nanometre. An electron is incident from the left and may tunnel to the right.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><g stroke="#536b67" stroke-width="2"><rect x="80" y="150" width="300" height="130" rx="45" fill="#e6c28f"/><rect x="440" y="150" width="300" height="130" rx="45" fill="#e6c28f"/><rect x="380" y="150" width="60" height="130" fill="#d4e0e3"/><path d="M380 110H440 M380 100V120 M440 100V120 M60 150V280 M50 150H70 M50 280H70" fill="none"/></g><path d="M170 215H650" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="365" y="95">1 nm</text><text x="10" y="225">1 mm</text><text x="180" y="325">Cu</text><text x="565" y="325">Cu</text><text x="355" y="145">L</text><text x="330" y="205">e⁻</text><text x="260" y="375">U₀ = 12 eV; E = 5 eV; 1 nm ≪ 1 mm</text></g></svg>
