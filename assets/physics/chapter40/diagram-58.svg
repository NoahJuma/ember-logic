<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Half-infinite potential well</title><desc id="desc">The potential is infinite for negative x, zero between zero and L, and U zero for x greater than L. The particle energy lies below U zero.</desc><rect width="820" height="450" fill="#fffdf7"/><g fill="none" stroke="#536b67" stroke-width="2"><path d="M130 355H730 M210 405V45"/><path d="M210 75V355H485V175H700" stroke="#08788a" stroke-width="5"/><path d="M210 175H485 M210 265H700" stroke-dasharray="8 6"/></g><g font-family="sans-serif" font-size="22" fill="#263f3b"><text x="182" y="65">∞</text><text x="150" y="185">U₀</text><text x="150" y="275">E</text><text x="198" y="390">0</text><text x="475" y="390">L</text><text x="735" y="365">x</text><text x="215" y="50">U(x)</text></g></svg>
