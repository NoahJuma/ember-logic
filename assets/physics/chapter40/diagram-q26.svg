<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Infinite box with an internal step</title><desc id="desc">The potential is zero between x zero and A, U zero between A and B, and infinite outside the box.</desc><rect width="820" height="450" fill="#fffdf7"/><g fill="none" stroke="#536b67" stroke-width="2"><path d="M110 355H735 M200 405V45"/><path d="M200 75V355H380V205H600V75" stroke="#08788a" stroke-width="5"/><path d="M200 205H380" stroke-dasharray="8 6"/></g><g font-family="sans-serif" font-size="22" fill="#263f3b"><text x="173" y="65">∞</text><text x="610" y="70">∞</text><text x="150" y="215">U₀</text><text x="190" y="390">0</text><text x="370" y="390">A</text><text x="590" y="390">B</text><text x="740" y="365">x</text><text x="205" y="50">U(x)</text></g></svg>
