<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Hydrogen energy levels and transitions</title><desc id="desc">Hydrogen levels n equals 1 through 5 are shown with a possible absorption from 1 to 4 and an emission from 3 to 2. Level spacing is not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="400" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><path d="M270 305H485 M270 235H485 M270 170H485 M270 105H485 M270 60H485" stroke="#315b60" stroke-width="3"/><path d="M335 300V110" stroke="#7356a0" stroke-width="4" marker-end="url(#arrow)"/><path d="M435 175V230" stroke="#c4564c" stroke-width="4" marker-end="url(#arrow)"/><text x="495" y="312">n = 1</text><text x="495" y="242">n = 2</text><text x="495" y="177">n = 3</text><text x="495" y="112">n = 4</text><text x="495" y="67">n = 5</text><text x="75" y="155">UV: 1 → 4</text><text x="75" y="195">Hα: 3 → 2</text><text x="155" y="365" font-size="17">levels not to scale / nivåer ej skalenliga</text></g></svg>
