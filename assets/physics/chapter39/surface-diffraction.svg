<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">Surface diffraction</title>
<desc id="desc">Parallel waves approach a row of atoms along the surface normal. Scattered rays leave at an angle theta to the normal; adjacent atoms are separated by d.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#176478"/></marker><marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0 L0 3.5 L7 7" fill="none" stroke="#493c31"/></marker></defs>
<rect width="720" height="390" fill="#faf7f0"/>
<rect x="90" y="290" width="540" height="20" fill="#d2cbc0"/>
<g fill="#d38b51" stroke="#744b30" stroke-width="2"><circle cx="160" cy="290" r="11"/><circle cx="300" cy="290" r="11"/><circle cx="440" cy="290" r="11"/><circle cx="580" cy="290" r="11"/></g>
<g stroke="#176478" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M300 55 V260"/><path d="M440 55 V260"/><path d="M307 282 L497 92"/><path d="M447 282 L637 92"/></g>
<path d="M300 278 V100" fill="none" stroke="#6b6259" stroke-dasharray="6 6" stroke-width="2"/>
<path d="M300 230 A60 60 0 0 1 342.4 247.6" fill="none" stroke="#493c31" stroke-width="2"/>
<text x="318" y="222" font-family="sans-serif" font-size="24" fill="#302821">θ</text>
<path d="M300 345 H440" stroke="#493c31" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
<path d="M300 309 V351 M440 309 V351" stroke="#493c31" stroke-width="1.5"/>
<text x="364" y="372" font-family="sans-serif" font-size="24" fill="#302821">d</text>
</svg>
