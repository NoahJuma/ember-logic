<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" role="img" aria-labelledby="title desc">
<title id="title">Otto cycle with numerical state values</title>
<desc id="desc">Schematic pressure-volume cycle: a to b adiabatic compression, b to c isochoric heating, c to d adiabatic expansion, d to a isochoric cooling. Numerical values are listed separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#176678"/></marker></defs>
<rect width="820" height="530" fill="#faf9f3"/><g stroke="#263b3d" stroke-width="2" fill="none"><path d="M70 390H430M70 390V40"/><path d="M70 40l-5 10m5-10 5 10M430 390l-10-5m10 5-10 5"/></g>
<g fill="none" stroke="#176678" stroke-width="4" marker-end="url(#arrow)"><path d="M350 345 C235 340 175 300 130 220"/><path d="M130 220V85"/><path d="M130 85 C190 155 260 215 350 245"/><path d="M350 245V345"/></g>
<g fill="#263b3d" font-family="system-ui,sans-serif" font-size="21"><text x="36" y="42">p</text><text x="433" y="405">V</text><text x="360" y="355">a</text><text x="105" y="230">b</text><text x="105" y="88">c</text><text x="360" y="252">d</text><text x="80" y="430" font-size="17">Schematic; not to scale / Skiss, inte skalenlig</text><text x="465" y="95">a: 0.510 L · 0.0850 MPa · 300 K</text><text x="465" y="145">b: 0.0481 L · 2.32 MPa · 771 K</text><text x="465" y="195">c: 0.0481 L · 4.00 MPa · 1333 K</text><text x="465" y="245">d: 0.510 L · 0.147 MPa · 518 K</text><text x="465" y="300" font-size="17">Values rounded / Avrundade värden</text></g></svg>
