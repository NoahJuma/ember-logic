<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Five Gaussian surfaces</title>
<desc id="desc">Separate views show which of six point charges are enclosed by each Gaussian surface. S1 encloses none. S2 encloses minus 7, plus 9 and plus 5 microcoulombs. S3 encloses plus 9, plus 1 and minus 10. S4 encloses plus 8 and minus 7. S5 encloses all six: minus 7, plus 8, plus 9, plus 1, minus 10 and plus 5.</desc>
<rect width="900" height="460" rx="14" fill="#fbfaf6"/>
<g fill="#ffffff" stroke="#d8e3db" stroke-width="2"><rect x="15" y="18" width="270" height="190" rx="12"/><rect x="315" y="18" width="270" height="190" rx="12"/><rect x="615" y="18" width="270" height="190" rx="12"/><rect x="165" y="238" width="270" height="190" rx="12"/><rect x="465" y="238" width="270" height="190" rx="12"/></g>
<g fill="none" stroke="#82459a" stroke-width="3"><ellipse cx="150" cy="120" rx="104" ry="64"/><ellipse cx="450" cy="120" rx="104" ry="64"/><ellipse cx="750" cy="120" rx="104" ry="64"/><ellipse cx="300" cy="340" rx="104" ry="64"/><ellipse cx="600" cy="340" rx="104" ry="64"/></g>
<g font-family="system-ui,sans-serif" fill="#263b39" font-size="21"><text x="30" y="48">S₁</text><text x="330" y="48">S₂</text><text x="630" y="48">S₃</text><text x="180" y="268">S₄</text><text x="480" y="268">S₅</text></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="17"><g fill="#bf6043"><text x="413" y="117">+5.0 μC</text><text x="487" y="117">+9.0 μC</text><text x="713" y="117">+9.0 μC</text><text x="787" y="117">+1.0 μC</text><text x="264" y="347">+8.0 μC</text><text x="553" y="322">+8.0 μC</text><text x="647" y="322">+5.0 μC</text><text x="553" y="350">+9.0 μC</text><text x="647" y="350">+1.0 μC</text></g><g fill="#3b7999"><text x="450" y="153">−7.0 μC</text><text x="750" y="153">−10.0 μC</text><text x="336" y="347">−7.0 μC</text><text x="553" y="378">−7.0 μC</text><text x="647" y="378">−10.0 μC</text></g></g>
</svg>
