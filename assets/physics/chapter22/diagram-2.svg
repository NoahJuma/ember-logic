<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-labelledby="title desc"><title id="title">Rectangular sheet in a tilted electric field</title><desc id="desc">The rectangle measures 0.400 by 0.600 metres. A side view shows the field at 20 degrees to its plane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="320" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M80 90H290V230H80Z" fill="#dfece5" stroke="#315b60" stroke-width="3"/><path d="M80 250H290" stroke="#315b60" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M60 90V230" stroke="#315b60" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="133" y="280">0.600 m</text><text x="38" y="172" transform="rotate(-90 38 172)">0.400 m</text><path d="M390 225H660" stroke="#9ab7aa" stroke-width="8"/><path d="M480 225L623 173" stroke="#c4564c" stroke-width="4" marker-end="url(#arrow)"/><path d="M530 225A50 50 0 0 0 527 208" fill="none" stroke="#315b60" stroke-width="2"/><text x="540" y="195">20°</text><text x="490" y="145">E = 76.0 N/C</text><text x="400" y="280" font-size="17">sidovy / side view</text></g></svg>
