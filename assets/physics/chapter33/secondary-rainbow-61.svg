<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img">
<title>Secondary rainbow: two internal reflections</title>
<desc>Sunlight enters a spherical drop at A, reflects inside at B and C, then leaves at D. Dashed radii are normals to the surface.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b84e27"/></marker></defs>
<rect width="780" height="470" fill="#fffdf7"/><circle cx="370" cy="230" r="180" fill="#eaf5f8" stroke="#176987" stroke-width="3"/>
<path d="M370 230 L314.4,58.8" stroke="#819397" stroke-dasharray="6 6"/>
<path d="M370 230 L539.9,170.5" stroke="#819397" stroke-dasharray="6 6"/>
<path d="M370 230 L433.3,398.5" stroke="#819397" stroke-dasharray="6 6"/>
<path d="M370 230 L203.0,297.1" stroke="#819397" stroke-dasharray="6 6"/>
<path d="M116.4,58.8 L314.4,58.8" fill="none" stroke="#b84e27" stroke-width="3" marker-end="url(#a)"/>
<path d="M314.4,58.8 L539.9,170.5" fill="none" stroke="#b84e27" stroke-width="3" marker-end="url(#a)"/>
<path d="M539.9,170.5 L433.3,398.5" fill="none" stroke="#b84e27" stroke-width="3" marker-end="url(#a)"/>
<path d="M433.3,398.5 L203.0,297.1" fill="none" stroke="#b84e27" stroke-width="3" marker-end="url(#a)"/>
<path d="M203.0,297.1 L76.0,145.2" fill="none" stroke="#b84e27" stroke-width="3" marker-end="url(#a)"/>
<circle cx="314.4" cy="58.8" r="4" fill="#24383c"/><text x="322.4" y="49.8" font-family="sans-serif" font-size="20" fill="#24383c">A</text>
<circle cx="539.9" cy="170.5" r="4" fill="#24383c"/><text x="547.9" y="161.5" font-family="sans-serif" font-size="20" fill="#24383c">B</text>
<circle cx="433.3" cy="398.5" r="4" fill="#24383c"/><text x="441.3" y="389.5" font-family="sans-serif" font-size="20" fill="#24383c">C</text>
<circle cx="203.0" cy="297.1" r="4" fill="#24383c"/><text x="211.0" y="288.1" font-family="sans-serif" font-size="20" fill="#24383c">D</text>
<text x="10" y="430" font-family="sans-serif" font-size="18" fill="#24383c">A → B → C → D</text></svg>