<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">A prism with liquid on its hypotenuse</title><desc id="desc">A ray enters the short face normally, travels to the hypotenuse covered by a liquid drop, and reflects there.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M180 100H600L285 282Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M320 91Q390 73 460 91Z" fill="#bce2eb" stroke="#536b67" stroke-width="2"/><path d="M100 267L232 191" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M232 191L390 100" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M390 100L510 170" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="175" y="88">60°</text><text x="570" y="88">30°</text><text x="290" y="265">90°</text><text x="340" y="75">liquid</text></g></svg>