<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Flashlight ray into a pool</title><desc id="desc">A flashlight 1.2 metres above the water at the pool edge is aimed at the water 1.5 metres from the edge. The refracted ray reaches the bottom 4.0 metres below.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M220 140H650V380H220Z" fill="#cfe7f4" stroke="#536b67" stroke-width="2"/><path d="M220 60V380" fill="none" stroke="#536b67" stroke-width="2"/><path d="M220 68L310 140" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M310 140L483 380" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M220 140H310" fill="none" stroke="#536b67" stroke-width="2"/><path d="M190 68V140 M184 68H196 M184 140H196" fill="none" stroke="#536b67" stroke-width="2"/><path d="M620 140V380 M614 140H626 M614 380H626" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="483" cy="380" r="5" fill="#243e3c"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="115" y="110">1.2 m</text><text x="240" y="165">1.5 m</text><text x="632" y="270">4.0 m</text><text x="468" y="410">key</text></g></svg>