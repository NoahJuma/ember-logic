<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Ray entering a right-angle prism</title><desc id="desc">A ray enters the first face of a right-angle prism and refracts at 40 degrees to its normal before reaching the second face at A.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M140 350L400 90L660 350Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M230 180L310 260" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M80 260L270 220" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M270 220L555 245" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M540 260L580 220" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="375" y="122">90°</text><text x="193" y="190">θₐ</text><text x="317" y="257">40.0°</text><text x="560" y="275">A</text></g></svg>