<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Transmitted polarization ellipse</title><desc id="desc">An illustrative polarization ellipse has its major axis along the p component and minor axis along the s component. The instantaneous electric-field vector points from the centre to the ellipse.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><ellipse cx="350" cy="235" rx="230" ry="205" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M75 235H650 M350 40V435" fill="none" stroke="#536b67" stroke-width="2"/><path d="M350 235L505 80" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="650" y="257">Eₚ</text><text x="360" y="57">Eₛ</text><text x="510" y="80">E</text></g></svg>