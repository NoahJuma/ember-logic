<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Two colors emerging from a prism</title><desc id="desc">A horizontal ray enters the vertical face normally. The exit face is at 35 degrees to horizontal. Two rays emerge 12.0 and 20.5 degrees below horizontal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M170 70L570 350H170Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M65 125H248" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M248 125L650 210" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M248 125L650 275" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M248 125H650" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="146" y="60">A</text><text x="577" y="359">B</text><text x="475" y="338">35.0°</text><text x="530" y="157">12.0°</text><text x="550" y="244">20.5°</text></g></svg>