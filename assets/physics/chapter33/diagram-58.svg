<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Object inside a refracting sphere</title><desc id="desc">A small object is concentric with a transparent sphere. A tangent ray reaches the outer surface and emerges horizontally. The diagram identifies the true radius r, outer radius R and apparent radius r prime.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><circle cx="300" cy="240" r="150" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><circle cx="300" cy="240" r="45" fill="#e9a567" stroke="#536b67" stroke-width="2"/><path d="M300 240L433.95 172.50" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M292.74 195.59L433.95 172.50L650 172.50" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M433.95 172.50V240" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M300 240H433.95" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><circle cx="300" cy="240" r="5" fill="#243e3c"/><circle cx="433.95428324618814" cy="172.5" r="5" fill="#243e3c"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="270" y="258">O</text><text x="307" y="214">r</text><text x="355" y="190">R</text><text x="445.95428324618814" y="210">r′</text><text x="183" y="150">n</text></g></svg>