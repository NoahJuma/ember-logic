<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Two rays entering a symmetric prism</title><desc id="desc">Parallel rays m and n enter normally through a vertical face and meet opposite slanted faces, each at 27 degrees to the vertical.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M160 60L252 240L160 420Z" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M50 145H203" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M50 335H203" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="60" y="130">m</text><text x="60" y="320">n</text><text x="180" y="195">27.0°</text><text x="180" y="302">27.0°</text></g></svg>