<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Light entering an optical fibre</title><desc id="desc">A ray enters the flat fibre end from air, travels in the core, and reflects at the boundary with the lower-index cladding.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><rect x="180" y="150" width="440" height="180" rx="24" fill="#f3ddad" stroke="#536b67" stroke-width="2"/><rect x="180" y="210" width="440" height="60" fill="#ffefd1" stroke="#536b67" stroke-width="1"/><path d="M70 240H650" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M70 263.5L180 240" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M180 240L388 210" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M388 210L620 243.5" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="290" y="262">n₁</text><text x="300" y="184">n₂</text><text x="95" y="235">θᵢ</text></g></svg>