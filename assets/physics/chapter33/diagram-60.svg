<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Ray path in a spherical water drop</title><desc id="desc">A ray enters at A, refracts into the drop, reflects once at B and refracts out at C. Dashed lines are radii normal to the surface.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><circle cx="350" cy="230" r="150" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M350 230L273.9 100.8 M350 230L490.0 176.1 M350 230L380.1 376.9" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M50 100.8L273.9 100.8" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M273.9 100.8L490.0 176.1" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M490.0 176.1L380.1 376.9" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M380.1 376.9L305.9 444.0" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><circle cx="273.8692455558944" cy="100.75562593377114" r="5" fill="#243e3c"/><circle cx="490.000474560093" cy="176.14958567523587" r="5" fill="#243e3c"/><circle cx="380.10508624003614" cy="376.94789478750624" r="5" fill="#243e3c"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="243.8692455558944" y="87.75562593377114">A</text><text x="503.000474560093" y="181.14958567523587">B</text><text x="353.10508624003614" y="404.94789478750624">C</text><text x="70" y="85.75562593377114">air</text><text x="325" y="230">water</text><text x="285.8692455558944" y="143.75562593377114">r</text><text x="218.8692455558944" y="68.75562593377114">i</text></g></svg>