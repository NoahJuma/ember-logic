<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Ray reflecting from a mirror toward a glass-water boundary</title><desc id="desc">A light ray in glass strikes the horizontal mirror at angle theta to the mirror, then travels toward the vertical glass-water interface. Its angle to the interface normal equals theta.</desc><defs><marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a45284"/></marker></defs><rect width="700" height="400" rx="14" fill="#fbf8f1"/><path d="M100 45H440V320H100Z" fill="#e3ede8"/><path d="M440 45H620V320H440Z" fill="#dcecf2"/><g font-family="Arial,sans-serif" font-size="21" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M100 320H440 M440 45V320" stroke="#315b60" stroke-width="4"/><path d="M200 119L320 320" fill="none" stroke="#a45284" stroke-width="4" marker-end="url(#ray)"/><path d="M320 320L440 119" fill="none" stroke="#a45284" stroke-width="4" marker-end="url(#ray)"/><path d="M380 119H520" fill="none" stroke="#7b9290" stroke-width="2" stroke-dasharray="7 7"/><path d="M270 320Q277 291 294 277" fill="none" stroke="#315b60" stroke-width="2"/><text x="268" y="295">θ</text><text x="455" y="103">θᵢ = θ</text><text x="125" y="75">glass / glas</text><text x="495" y="75">water / vatten</text><text x="105" y="357">mirror / spegel</text><text x="472" y="150" font-size="17">normal</text></g></svg>
