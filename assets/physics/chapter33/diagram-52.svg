<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Refraction through a parallel-sided plate</title><desc id="desc">A ray refracts at the upper surface of a parallel-sided plate and emerges parallel to its incident direction. The dashed line continues the original ray.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><rect x="115" y="150" width="485" height="150" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M300 70V235" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M388.4 220V370" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M50 38.7L300 150" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M300 150L388.4 300" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M388.4 300L650 416.5" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M300 150L637 300" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M520 358.6L561.1 266.2 M513 355.5L527 361.7 M554.1 263.1L568.1 269.3" fill="none" stroke="#536b67" stroke-width="2"/><path d="M85 150V300 M80 150H90 M80 300H90" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="57" y="235">t</text><text x="225" y="98">θ₁</text><text x="310" y="205">θ₂</text><text x="551" y="320">d</text><text x="195" y="235">n₂</text><text x="130" y="125">n₁</text><text x="130" y="330">n₁</text></g></svg>