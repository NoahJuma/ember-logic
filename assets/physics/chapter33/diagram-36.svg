<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Viewing a line through water</title><desc id="desc">A ray from the real line bends at the water surface. Extending the outgoing ray backward gives the apparent image, displaced by s; d is the horizontal distance from the real line to the vertical below the surface point.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M260 140H570L550 360H280Z" fill="#d7edf6" stroke="#536b67" stroke-width="2"/><path d="M260 140H570 M470 100V390" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M360 360L470 140L559.1 20" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M470 140L306.7 360" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M306.7 387H360 M360 387H470 M306.7 379V395 M360 379V395 M470 379V395" fill="none" stroke="#536b67" stroke-width="2"/><path d="M600 140V360 M594 140H606 M594 360H606" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="360" cy="360" r="5" fill="#243e3c"/><circle cx="306.651481839083" cy="360" r="5" fill="#243e3c"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="605" y="255">H</text><text x="328.3257409195415" y="415">s</text><text x="410" y="415">d</text><text x="348" y="445">real</text><text x="270.651481839083" y="445">image</text><text x="478" y="115">θₐ</text><text x="430" y="195">θᵥ</text></g></svg>