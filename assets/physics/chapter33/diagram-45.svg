<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Empty and filled cylindrical glass</title><desc id="desc">The same line of sight grazes the near rim. In the empty glass it reaches the far edge of the bottom; with liquid it reaches the bottom center.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M115 90V410H275V90" fill="none" stroke="#536b67" stroke-width="3"/><path d="M425 90V410H585V90Z" fill="#cfe7f4" stroke="#536b67" stroke-width="3"/><path d="M115 90H275 M425 90H585" fill="none" stroke="#536b67" stroke-width="2"/><path d="M275 410L115 90" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M115 90L75 10" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M505 410L425 90" fill="none" stroke="#ad488b" stroke-width="4"/><path d="M425 90L385 10" fill="none" stroke="#ad488b" stroke-width="4"/><circle cx="275" cy="410" r="5" fill="#243e3c"/><circle cx="505" cy="410" r="5" fill="#243e3c"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="35" y="255">16.0 cm</text><text x="155" y="448">8.0 cm</text><text x="175" y="466">(a)</text><text x="485" y="466">(b)</text></g></svg>