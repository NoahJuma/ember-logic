<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Atmospheric refraction at the horizon</title><desc id="desc">A schematic cross-section shows an Earth of radius R with an exaggerated atmosphere of thickness h. A ray from the Sun bends at the atmospheric boundary toward an observer at the horizon.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><path d="M105 390A235 235 0 0 1 575 390Z" fill="#d8ebd0" stroke="#536b67" stroke-width="2"/><path d="M70 390A270 270 0 0 1 610 390L575 390A235 235 0 0 0 105 390Z" fill="#d6ebf4" stroke="#536b67" stroke-width="2"/><path d="M340 390V120" fill="none" stroke="#536b67" stroke-width="2"/><path d="M340 155H660" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M660 210L472.9 155" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M472.9 155L340 155" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M340 155L660 155" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="250" y="300">R</text><text x="347" y="142">h</text><text x="490" y="205">n</text><text x="595" y="210">sun</text><text x="585" y="148">apparent</text><text x="485" y="164">δ</text></g></svg>