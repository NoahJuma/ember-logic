<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Refraction and total internal reflection at a block</title><desc id="desc">A ray in air enters the horizontal top of a block and travels toward its left vertical side. Angle theta a is measured from the top-surface normal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="720" height="480" fill="#fffdf7"/><rect x="200" y="165" width="310" height="245" fill="#dbeaf4" stroke="#536b67" stroke-width="2"/><path d="M340 70V240" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 6"/><path d="M465 60L340 165" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M340 165L200 372" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#243e3c"><text x="520" y="235">n = 1.37</text><text x="365" y="110">θₐ</text><text x="176" y="382">A</text></g></svg>