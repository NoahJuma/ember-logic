<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Loop in a circularly polarized wave</title><desc id="desc">A rectangular loop lies in the xz plane, from x zero to h and z zero to half a wavelength. Its positive surface normal is along positive y. The electromagnetic wave propagates along positive z.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="470" fill="#fffdf7"/><path d="M240 330 L240 130 L520 200 L520 400Z" fill="#f2dcab" fill-opacity=".5" stroke="#536b67" stroke-width="4"/><g fill="none" stroke="#536b67" stroke-width="2"><path d="M240 365V70 M180 315L720 450 M240 330L95 415"/><path d="M215 130V330 M205 130H225 M205 330H225 M250 110L530 180 M250 100V120 M530 170V190"/></g><g stroke="#ad488b" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M240 330V200"/><path d="M240 330L155 390"/><path d="M540 410L700 450"/></g><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="248" y="65">x</text><text x="85" y="430">+y (normal)</text><text x="710" y="450">+z</text><text x="183" y="235">h</text><text x="385" y="128">λ/2</text><text x="265" y="200">E(0, 0)</text><text x="35" y="355">B(0, 0)</text></g></svg>
