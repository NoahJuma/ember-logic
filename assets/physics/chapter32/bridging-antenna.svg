<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Radio wave crossing a loop antenna</title><desc id="desc">A wave travels in positive x. At the illustrated instant its electric field points in positive y and its magnetic field points out of the xy plane, perpendicular to the loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="400" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="22" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><circle cx="450" cy="220" r="100" fill="#e4eee8" stroke="#b67a45" stroke-width="7"/><circle cx="450" cy="220" r="14" fill="none" stroke="#4b6fa0" stroke-width="3"/><circle cx="450" cy="220" r="4" fill="#4b6fa0"/><path d="M70 220H310" fill="none" stroke="#315b60" stroke-width="4" marker-end="url(#arrow)"/><path d="M450 220V95" fill="none" stroke="#c4564c" stroke-width="4" marker-end="url(#arrow)"/><path d="M450 340H550" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 340V270" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><text x="130" y="200">+x, c</text><text x="468" y="106">E (+y)</text><text x="565" y="225">B (+z) ⊙</text><text x="557" y="350">x</text><text x="425" y="272">y</text><text x="165" y="365" font-size="17">xy-plane / xy-planet · schematic / schematisk</text></g></svg>
