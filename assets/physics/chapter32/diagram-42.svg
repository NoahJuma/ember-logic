<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Loop antenna and resonant circuit</title><desc id="desc">A square coil lies in the yz plane, centered at the origin. The wave travels along positive z, the electric field is parallel to y, and the coil is connected in series to a resistor and capacitor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="470" fill="#fffdf7"/><g fill="none" stroke="#536b67" stroke-width="3"><path d="M280 345H210V120H460V345H390" stroke="#bb8749" stroke-width="8"/><path d="M220 335V130H450V335" stroke="#bb8749"/><path d="M210 345V440H700V383 M700 367V345H620 M540 345H460"/><rect x="540" y="330" width="80" height="30" fill="#fffdf7"/><path d="M680 367H720 M680 383H720"/><path d="M335 380V60 M120 232H510 M335 232L210 335" stroke-width="2"/><path d="M190 120V345 M180 120H200 M180 345H200 M210 100H460 M210 90V110 M460 90V110" stroke-width="2"/></g><g stroke="#ad488b" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M360 220H490"/><path d="M320 210V75"/></g><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="500" y="215">E (+y)</text><text x="325" y="65">+z</text><text x="150" y="355">+x</text><text x="320" y="95">a</text><text x="165" y="245">a</text><text x="565" y="325">R</text><text x="730" y="380">C</text><text x="242" y="390">N, L</text></g></svg>
