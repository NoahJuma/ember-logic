<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-labelledby="title desc"><title id="title">Charged rod and point charge</title><desc id="desc">A rod from minus a to plus a carries positive charge; point charge q is placed at L on its right.</desc><rect width="700" height="220" fill="#fffdf7"/><path d="M50 125H650 M650 125l-12-6m12 6l-12 6" fill="none" stroke="#344b4b" stroke-width="2"/><path d="M160 125H410" stroke="#dd7841" stroke-width="14" stroke-linecap="round"/><g stroke="#344b4b" stroke-width="2"><path d="M160 115v25 M285 115v25 M410 115v25 M545 115v25"/></g><circle cx="545" cy="125" r="13" fill="#08788a"/><g font-family="sans-serif" font-size="20" fill="#253c3d"><text x="147" y="169">−a</text><text x="280" y="169">0</text><text x="398" y="169">+a</text><text x="538" y="169">L</text><text x="658" y="130">x</text><text x="538" y="92">+q</text><text x="220" y="91">+ + + + Q</text></g></svg>
