<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-labelledby="title desc"><title id="title">Force versus time, problem 8.70</title><desc id="desc">A triangle rises from zero newtons at zero seconds to five newtons at four seconds, then falls to zero at ten seconds.</desc><rect width="500" height="280" fill="#fff"/><path d="M60 220H460M60 220V25" fill="none" stroke="#333" stroke-width="2"/><path d="M60 220L216 45L450 220Z" fill="#d7ece6" stroke="#19747d" stroke-width="4"/><path d="M216 45V220M60 45H216" stroke="#888" stroke-dasharray="5 5"/><g font-family="sans-serif" font-size="17" fill="#26312f"><text x="15" y="35">F (N)</text><text x="442" y="250">t (s)</text><text x="46" y="245">0</text><text x="207" y="245">4</text><text x="440" y="245">10</text><text x="36" y="50">5</text></g></svg>
