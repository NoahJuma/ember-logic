<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A galvanometer with shunt resistor</title><desc id="desc">The galvanometer coil and unknown series resistor form a branch in parallel with a 0.0250-ohm shunt.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M140 225V110H260 M340 110H458 M502 110H650V225 M140 225V335H355 M435 335H650V225"/></g><rect x="260" y="95" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="268" y="85">R</text><circle cx="480" cy="110" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="473" y="117">G</text><rect x="355" y="320" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="363" y="310">0.0250 Ω</text><circle cx="140" cy="225" r="5" fill="#3d5652"/><circle cx="650" cy="225" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="468" y="77">9.36 Ω</text><text x="360" y="391">shunt</text></g></svg>