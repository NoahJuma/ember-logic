eight="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="620" y="282">40 Ω</text><rect x="480" y="335" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="488" y="325">50 Ω</text><rect x="480" y="405" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="488" y="395">50 Ω</text><path d="M28 252H72 M37 268H63" stroke="#3d5652" stroke-width="3"/><text x="82" y="267">ε</text><text x="12" y="242">+</text><circle cx="340" cy="125" r="5" fill="#3d5652"/><circle cx="650" cy="125" r="5" fill="#3d5652"/><circle cx="300" cy="385" r="5" fill="#3d5652"/><circle cx="600" cy="385" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="65" y="320">P_max = 2.00 W</text></g></svg>