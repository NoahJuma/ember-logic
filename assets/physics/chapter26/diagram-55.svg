<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Parallel source branches and resistor</title><desc id="desc">A 24-volt source with 2-ohm internal resistance, a 36-volt source with 2-ohm internal resistance, and a 20-ohm resistor connect in parallel. Both source positive terminals are at the top.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M120 85H680 M120 395H680 M120 85V135 M120 205V247 M120 263V395 M400 85V135 M400 205V247 M400 263V395 M680 85V205 M680 275V395"/></g><rect x="105" y="135" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="149" y="177">2.00 Ω</text><path d="M98 247H142 M107 263H133" stroke="#3d5652" stroke-width="3"/><text x="152" y="262">24.0 V</text><text x="82" y="237">+</text><rect x="385" y="135" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="429" y="177">2.00 Ω</text><path d="M378 247H422 M387 263H413" stroke="#3d5652" stroke-width="3"/><text x="432" y="262">36.0 V</text><text x="362" y="237">+</text><rect x="665" y="205" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="580" y="247">20.0 Ω</text></svg>