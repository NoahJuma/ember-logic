<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">An RC circuit with two branches</title><desc id="desc">A forty-two-volt source and eight-ohm resistor feed two parallel branches: six ohms, and three ohms in series with a four-microfarad capacitor.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M100 100H250 M330 100H650 M100 100V180 M100 220V257 M100 273V410H650 M400 100V220 M400 290V410 M650 100V165 M650 235V312 M650 328V410"/></g><rect x="250" y="85" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="258" y="75">R₁ = 8.00 Ω</text><path d="M78 257H122 M87 273H113" stroke="#3d5652" stroke-width="3"/><text x="132" y="272">42.0 V</text><text x="62" y="247">+</text><rect x="385" y="220" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="429" y="262">R₂ = 6.00 Ω</text><rect x="635" y="165" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="550" y="207">R₃ = 3.00 Ω</text><path d="M628 312H672 M628 328H672" stroke="#3d5652" stroke-width="3"/><text x="681" y="327">4.00 μF</text><circle cx="400" cy="100" r="5" fill="#3d5652"/><circle cx="400" cy="410" r="5" fill="#3d5652"/><circle cx="100" cy="180" r="5" fill="#3d5652"/><circle cx="100" cy="220" r="5" fill="#3d5652"/><path d="M100 180L80 215" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="60" y="200">S</text></g></svg>