<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A source and two-branch circuit with an ammeter</title><desc id="desc">A seventy-five-volt source and twelve-ohm series resistor feed parallel branches: forty-eight ohms and an unknown source in series with fifteen ohms. The supply current is 1.50 amperes.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M135 90H270 M350 90H650 M135 90V222 M135 238V390H305 M349 390H650 M430 90V205 M430 275V390 M650 90V142 M650 158V225 M650 295V390"/></g><rect x="270" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="278" y="65">12.0 Ω</text><path d="M113 222H157 M122 238H148" stroke="#3d5652" stroke-width="3"/><text x="167" y="237">75.0 V</text><text x="97" y="212">+</text><rect x="415" y="205" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="459" y="247">48.0 Ω</text><path d="M628 142H672 M637 158H663" stroke="#3d5652" stroke-width="3"/><text x="682" y="157">ε</text><text x="612" y="132">+</text><rect x="635" y="225" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="550" y="267">15.0 Ω</text><circle cx="327" cy="390" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="320" y="397">A</text><circle cx="430" cy="90" r="5" fill="#3d5652"/><circle cx="430" cy="390" r="5" fill="#3d5652"/><path d="M460 428H365" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="385" y="455">1.50 A</text></g></svg>