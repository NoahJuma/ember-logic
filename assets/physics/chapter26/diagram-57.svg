<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Resistor circuit with an open central connection</title><desc id="desc">The outer loop has two 2-ohm resistors on the left, 1 and 2 ohms on the right, and 12-volt and 8-volt sources in the upper and lower branches, each with one ohm. The central branch begins at b and contains 10 volts, one ohm and three ohms; a and b are initially disconnected.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M130 90H290 M370 90H422 M438 90H690 V125 M690 195V225 M690 225V285 M690 355V390H438 M422 390H370 M290 390H130 V355 M130 285V225 M130 225V195 M130 125V90 M250 225H290 M370 225H422 M438 225H500 M580 225H690"/></g><rect x="115" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="159" y="167">2 Ω</text><rect x="115" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="159" y="327">2 Ω</text><rect x="675" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="590" y="167">1 Ω</text><rect x="675" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="590" y="327">2 Ω</text><rect x="290" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="298" y="65">1 Ω</text><path d="M422 68V112 M438 77V103" stroke="#3d5652" stroke-width="3"/><text x="400" y="58">12 V</text><text x="398" y="97">+</text><rect x="290" y="375" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="298" y="365">1 Ω</text><path d="M422 368V412 M438 377V403" stroke="#3d5652" stroke-width="3"/><text x="400" y="358">8 V</text><text x="398" y="397">+</text><rect x="290" y="210" 