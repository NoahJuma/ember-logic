<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">A 20 ohm branch is parallel to a branch of 6 and 8 ohms in parallel followed by 25 ohms. Current through 6 ohms is four amperes left to right.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M70 150 H130 V80 H210 M290 80 H350 V210 H290 M210 210 H130 V150 M350 150 H410 M490 150 H600 V280 H390 M310 280 H70 V150" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(250 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(250 210) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(450 150) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(350 280) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="250" y="52">6.00 Ω</text><text x="250" y="245">8.00 Ω</text><text x="450" y="120">25.0 Ω</text><text x="350" y="320">20.0 Ω</text><text x="250" y="115">4.00 A →</text></g><g fill="none" stroke="#263d42" stroke-width="3"><path d="M70 280 V350 H325 M345 350 H600 V280 M325 330 V370 M345 338 V362"/></g><g fill="#183239" font-family="sans-serif" font-size="20"><text x="300" y="350">+</text><text x="330" y="390">ε</text></g></svg>