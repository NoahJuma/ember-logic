<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A resistor-capacitor bridge</title><desc id="desc">Two branches connect eighteen volts to ground. The left has six ohms above a and three microfarads below; the right has six microfarads above b and three ohms below. A switch joins a and b.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M160 75H650 M160 405H650 M160 75V125 M160 195V285 M160 301V405 M650 75V125 M650 141V285 M650 355V405 M160 240H360 M445 240H650"/></g><rect x="145" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="189" y="167">6.00 Ω</text><path d="M138 285H182 M138 301H182" stroke="#3d5652" stroke-width="3"/><text x="191" y="300">3.00 μF</text><path d="M628 125H672 M628 141H672" stroke="#3d5652" stroke-width="3"/><text x="681" y="140">6.00 μF</text><rect x="635" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="550" y="327">3.00 Ω</text><circle cx="160" cy="240" r="5" fill="#3d5652"/><circle cx="650" cy="240" r="5" fill="#3d5652"/><circle cx="360" cy="240" r="5" fill="#3d5652"/><circle cx="445" cy="240" r="5" fill="#3d5652"/><path d="M360 240L430 215" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="104" y="62">18.0 V</text><text x="103" y="435">0 V</text><text x="135" y="230">a</text><text x="664" y="230">b</text><text x="391" y="198">S</text></g></svg>