<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">NPN transistor amplifier</title><desc id="desc">An NPN transistor collector connects through one kiloohm to a fifteen-volt supply, and its emitter connects through one hundred ohms to ground. The input voltage is applied to the base, and output is the collector voltage relative to ground.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M105 85H570 V110 M570 180V205 M570 275V315 M570 385V410H105 V253 M105 237V85 M570 205H700 M700 205V320 M700 365V410H570 M320 410V303 M320 287V240 H535"/></g><path d="M83 237H127 M92 253H118" stroke="#3d5652" stroke-width="3"/><text x="137" y="252">15 V</text><text x="67" y="227">+</text><rect x="555" y="110" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="599" y="152">1.0 kΩ</text><rect x="555" y="315" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="599" y="357">100 Ω</text><path d="M298 287H342 M307 303H333" stroke="#3d5652" stroke-width="3"/><text x="352" y="302">Vᵢₙ</text><text x="282" y="277">+</text><circle cx="570" cy="205" r="5" fill="#3d5652"/><circle cx="570" cy="410" r="5" fill="#3d5652"/><circle cx="570" cy="240" r="35" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><path d="M535 240H550 M550 220V260 M550 230L570 212 M570 212V205 M550 250L570 268 M570 268V275" stroke="#3d5652" stroke-width="3" fill="none"/><path d="M562 260L575 273" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="580" y="204">c</text><text x="520" y="230">b</text><text x="585" y="290">e</text><text x="710" y="230">+</text><text x="710" y="398">−</text><text x=