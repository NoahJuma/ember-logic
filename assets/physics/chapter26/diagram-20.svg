<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Three parallel resistors across a battery</title><desc id="desc">An ideal battery is connected across three parallel branches containing ten ohms, R two and R one. R one carries two amperes and dissipates fifteen watts.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M100 90H720 M100 390H720 M100 90V217 M100 233V390 M300 90V165 M300 235V390 M510 90V165 M510 235V390 M720 90V165 M720 235V390"/></g><path d="M78 217H122 M87 233H113" stroke="#3d5652" stroke-width="3"/><text x="132" y="232">ε</text><text x="62" y="207">+</text><rect x="285" y="165" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="329" y="207">10.0 Ω</text><rect x="495" y="165" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="539" y="207">R₂</text><rect x="705" y="165" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="620" y="207">R₁</text><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="564" y="280">I₁ = 2.00 A</text><text x="564" y="310">P₁ = 15.0 W</text><text x="120" y="70">I total = 3.50 A</text></g></svg>