<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Switched charging circuit</title><desc id="desc">A two-position switch initially connects the capacitor and resistor without the source. In position two, a 28-volt source charges the 5.90-microfarad capacitor through resistor R.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M370 105V75H760V360H620 M410 105H620 V192 M620 208V360H460 M380 360H200 V242 M200 226V165H390 V135"/></g><path d="M178 226H222 M178 242H222" stroke="#3d5652" stroke-width="3"/><text x="231" y="241">C = 5.90 μF</text><path d="M598 192H642 M607 208H633" stroke="#3d5652" stroke-width="3"/><text x="652" y="207">28.0 V</text><text x="582" y="182">+</text><rect x="380" y="345" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="388" y="335">R</text><circle cx="620" cy="360" r="5" fill="#3d5652"/><circle cx="370" cy="105" r="5" fill="#3d5652"/><circle cx="410" cy="105" r="5" fill="#3d5652"/><path d="M390 135L370 105" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="345" y="55">1</text><text x="420" y="55">2</text><text x="340" y="420">1 → 2, t = 0</text></g></svg>