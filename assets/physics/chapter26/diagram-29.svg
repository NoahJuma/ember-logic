<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Branched circuit with a switched source</title><desc id="desc">The left node connects to 75 ohms and to a 20-ohm resistor in series with an unknown source. A 30-ohm resistor joins the right node, which connects to a switched 25-volt source and a 50-ohm resistor. An ideal voltmeter is across the 50-ohm resistor and an ammeter measures its current.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M80 90H260 M340 90H590 M80 90V180 M80 250V400H590 M225 90V125 M225 195V247 M225 263V400 M450 90V150 M450 166V250 M450 290V400 M590 90V113 M590 157V180 M590 250V400 M590 170H750 V218 M750 262V400H590"/></g><rect x="65" y="180" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="109" y="222">75 Ω</text><rect x="210" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="254" y="167">20 Ω</text><path d="M203 247H247 M212 263H238" stroke="#3d5652" stroke-width="3"/><text x="257" y="262">ε</text><text x="187" y="237">+</text><rect x="260" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="268" y="65">30 Ω</text><path d="M428 150H472 M437 166H463" stroke="#3d5652" stroke-width="3"/><text x="482" y="165">25 V</text><text x="412" y="140">+</text><rect x="575" y="180" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="490" y="222">50 Ω</text><circle cx="750" cy="240" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="743" y="247">V</text><circle cx="590" cy="135" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="583" y="142">A</text><circle cx="225" cy="90" r="5" fill="#3d5652"/><circle cx="450" cy="90" r="5" fill="#3d5652"/><circle cx="590" cy="90" r="5" fill="#3d5652"/><circle cx="590" cy="400" r="5" fill="#3d5652"/><path d="M450 250L435 280" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="460" y="285">S</text><text x="520" y="445">V = 17.0 V</text></g></svg>