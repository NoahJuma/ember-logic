<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Capacitor with inserted dielectric</title><desc id="desc">A capacitor is connected to a ten-volt battery through a ten-ohm resistor. A dielectric slab of kappa twelve fills the capacitor gap.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M120 90H310 M390 90H650V217 M650 233V390H120V253 M120 237V90"/></g><path d="M98 237H142 M107 253H133" stroke="#3d5652" stroke-width="3"/><text x="152" y="252">10.0 V</text><text x="82" y="227">+</text><rect x="310" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="318" y="65">10.0 Ω</text><path d="M628 217H672 M628 233H672" stroke="#3d5652" stroke-width="3"/><text x="681" y="232">κ = 12.0</text><path d="M350 145H430" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="380" y="175">I</text><text x="438" y="300">A = (2.00 cm)²</text><text x="438" y="330">d = 3.00 mm</text></g></svg>