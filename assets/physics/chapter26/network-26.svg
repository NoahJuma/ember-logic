<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">Three branches share two nodes. Top and middle have sources and resistors in series, with nodes a and b after the sources; the bottom branch is a ten ohm resistor.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M90 80 V320 H310 M390 320 H610 V80 H490 M410 80 H290 M270 80 H220 M140 80 H90 M90 200 H140 M220 200 H270 M290 200 H410 M490 200 H610" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(180 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(450 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(180 200) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(450 200) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(350 320) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M270 56 V104 M290 68 V92 M270 176 V224 M290 188 V212" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="180" y="52">2.00 Ω</text><text x="280" y="32">10.00 V</text><text x="255" y="60">+</text><text x="365" y="115">a</text><text x="450" y="52">3.00 Ω</text><text x="180" y="172">1.00 Ω</text><text x="280" y="152">5.00 V</text><text x="255" y="180">+</text><text x="365" y="235">b</text><text x="450" y="172">4.00 Ω</text><text x="350" y="365">10.00 Ω</text></g></svg>