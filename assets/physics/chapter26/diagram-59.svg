<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Three-node current network</title><desc id="desc">Five ohms and eight ohms form the upper path. The middle path has a 12-volt source positive left and one ohm on the left, and one ohm and a 9-volt source positive right on the right. Ten ohms connect the outer nodes below.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M90 90H150 M230 90H350 M350 90H470 M550 90H690 V360 H450 M370 360H90 V90 M90 225H162 M178 225H250 M330 225H350 M350 225H430 M510 225H602 M618 225H690 M350 90V225"/></g><rect x="150" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="158" y="65">5 Ω</text><rect x="470" y="75" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="478" y="65">8 Ω</text><path d="M162 203V247 M178 212V238" stroke="#3d5652" stroke-width="3"/><text x="140" y="193">12 V</text><text x="138" y="232">+</text><rect x="250" y="210" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="258" y="200">1 Ω</text><rect x="430" y="210" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="438" y="200">1 Ω</text><path d="M618 203V247 M602 212V238" stroke="#3d5652" stroke-width="3"/><text x="580" y="193">9 V</text><text x="626" y="232">+</text><rect x="370" y="345" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="378" y="335">10 Ω</text><circle cx="90" cy="225" r="5" fill="#3d5652"/><circle cx="350" cy="225" r="5" fill="#3d5652"/><circle cx="690" cy="225" r="5" fill="#3d5652"/><path d="M335 270H240" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><path d="M365 270H450" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><path d="M440 410H540" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="265" y="300">I₂</text><text x="400" y="300">I₁</text><text x="470" y="440">I₃</text></g></svg>