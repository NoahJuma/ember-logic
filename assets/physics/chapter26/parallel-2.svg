<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">Four resistors X, 15.0, 5.0 and 10.0 ohms connect in parallel between nodes a and b.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M100 90 H600 M100 310 H600" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 90 L170.0 160.0 M170.0 240.0 L170 310" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(170.0 200.0) rotate(90.0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M290 90 L290.0 160.0 M290.0 240.0 L290 310" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(290.0 200.0) rotate(90.0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M410 90 L410.0 160.0 M410.0 240.0 L410 310" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(410.0 200.0) rotate(90.0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M530 90 L530.0 160.0 M530.0 240.0 L530 310" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(530.0 200.0) rotate(90.0)" fill="none" stroke="#a44e39" stroke-width="4"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="75" y="100">a</text><text x="75" y="320">b</text><text x="205" y="210">X</text><text x="345" y="210">15.0 Ω</text><text x="455" y="210">5.0 Ω</text><text x="585" y="210">10.0 Ω</text></g></svg>