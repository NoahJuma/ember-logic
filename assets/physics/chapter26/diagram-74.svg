<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A Wheatstone bridge</title><desc id="desc">Two parallel branches have N over M and P over X; a galvanometer connects their midpoints and reads zero at balance.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M180 75H630 M180 405H630 M180 75V125 M180 195V285 M180 355V405 M630 75V125 M630 195V285 M630 355V405 M180 240H383 M427 240H630"/></g><rect x="165" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="209" y="167">N</text><rect x="165" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="209" y="327">M</text><rect x="615" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="530" y="167">P</text><rect x="615" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="530" y="327">X</text><circle cx="405" cy="240" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="398" y="247">G</text><circle cx="180" cy="240" r="5" fill="#3d5652"/><circle cx="630" cy="240" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="345" y="55">V</text></g></svg>