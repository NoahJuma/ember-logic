<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Cube of twelve resistors</title><desc id="desc">Each edge of the cube is a resistor R. Terminals a and b lie at opposite corners connected by a body diagonal, shown dashed.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M145 160L365 160"/><path d="M365 160L365 365"/><path d="M365 365L145 365"/><path d="M145 365L145 160"/><path d="M300 70L520 70"/><path d="M520 70L520 275"/><path d="M520 275L300 275"/><path d="M300 275L300 70"/><path d="M145 160L300 70"/><path d="M365 160L520 70"/><path d="M365 365L520 275"/><path d="M145 365L300 275"/><path d="M145 365L520 70" stroke-dasharray="7 6"/></g><circle cx="145" cy="160" r="5" fill="#3d5652"/><circle cx="365" cy="160" r="5" fill="#3d5652"/><circle cx="365" cy="365" r="5" fill="#3d5652"/><circle cx="145" cy="365" r="5" fill="#3d5652"/><circle cx="300" cy="70" r="5" fill="#3d5652"/><circle cx="520" cy="70" r="5" fill="#3d5652"/><circle cx="520" cy="275" r="5" fill="#3d5652"/><circle cx="300" cy="275" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="80" y="390">a</text><text x="535" y="65">b</text><text x="560" y="180">12 edges: R</text></g></svg>