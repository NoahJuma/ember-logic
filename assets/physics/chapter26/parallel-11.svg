<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">R1 and R2 form parallel branches; their combination is in series with R3 and an ideal source.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M80 80 H190 V150 H280 M360 150 H500 V80 H360 M280 80 H190 M500 115 H600 V330 H440 M360 330 H80 V215 M80 185 V80" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(320 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(320 150) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(400 330) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M60 185 H100 M68 215 H92" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="320" y="52">R₁</text><text x="320" y="190">R₂</text><text x="400" y="367">R₃</text><text x="48" y="201">ε</text><text x="65" y="172">+</text></g></svg>