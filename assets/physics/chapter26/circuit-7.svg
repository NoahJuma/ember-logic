<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">A 25 volt source, its 3.86 ohm internal resistance, an 18 ohm resistor and an ammeter form one branch; 45 and 15 ohm resistors form separate parallel branches.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M80 80 H230 M310 80 H620 V320 H310 M230 320 H80 V80 M80 200 H140 M160 200 H220 M300 200 H340 M420 200 H500 M540 200 H620" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(270 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(270 320) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(260 200) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(380 200) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M140 186 V214 M160 172 V228" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="200" r="20" fill="#eaf4f2" stroke="#263d42" stroke-width="3"/><text x="520" y="207" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183239">A</text><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="270" y="50">45.0 Ω</text><text x="270" y="365">15.0 Ω</text><text x="260" y="170">3.86 Ω</text><text x="380" y="170">18.0 Ω</text><text x="150" y="150">25.0 V</text><text x="174" y="165">+</text></g></svg>