<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">Two parallel branches across an ideal 48 volt source: 1 and 3 ohms in series, and 7 and 5 ohms in series.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M70 150 H130 V90 H190 M270 90 H410 M490 90 H570 V210 H490 M410 210 H270 M190 210 H130 V150 M570 150 H630 V320 H410 M390 320 H70 V150" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(230 90) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(450 90) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(230 210) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(450 210) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M390 295 V345 M410 306 V334" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="230" y="62">1.00 Ω</text><text x="450" y="62">3.00 Ω</text><text x="230" y="250">7.00 Ω</text><text x="450" y="250">5.00 Ω</text><text x="380" y="285">+</text><text x="400" y="365">48.0 V</text></g></svg>