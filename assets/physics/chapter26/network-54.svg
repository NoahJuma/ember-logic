<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">R1 and R2 are in series in one branch parallel to R3. That combination is in series with R4 and the source.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M70 150 H130 V80 H200 M280 80 H420 M500 80 H570 V220 H390 M310 220 H130 V150 M570 150 H630 V320 H440 M360 320 H310 M290 320 H70 V150" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(240 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(460 80) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(350 220) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(400 320) rotate(0)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M290 295 V345 M310 306 V334" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="240" y="52">R₁</text><text x="460" y="52">R₂</text><text x="350" y="260">R₃</text><text x="400" y="365">R₄</text><text x="275" y="285">+</text><text x="300" y="370">48.0 V</text></g></svg>