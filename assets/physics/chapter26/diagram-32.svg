<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Three-branch circuit with parallel resistors</title><desc id="desc">Three branches connect the same upper and lower nodes. The middle branch has six ohms, a 25-volt source positive at the top and three ohms, with current upward. The right branch has two parallel 20-ohm resistors, 19 ohms, an ammeter and one ohm. The left has 17 ohms, an unknown source and 13 ohms.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M100 100H210 M290 100H400 M100 100V207 M100 223V300 M100 370V400H400 M400 100V125 M400 195V222 M400 238V285 M400 355V400 M400 100H480 V60 H520 M600 60H700 V110 M480 100V145 H520 M600 145H700 V110 M700 110V180 M700 250V278 M700 322V400H640 M560 400H400"/></g><rect x="210" y="85" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="218" y="75">17 Ω</text><path d="M78 207H122 M87 223H113" stroke="#3d5652" stroke-width="3"/><text x="132" y="222">ε</text><text x="62" y="197">+</text><rect x="85" y="300" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="129" y="342">13 Ω</text><rect x="385" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="429" y="167">6 Ω</text><path d="M378 222H422 M387 238H413" stroke="#3d5652" stroke-width="3"/><text x="432" y="237">25 V</text><text x="362" y="212">+</text><rect x="385" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="429" y="327">3 Ω</text><rect x="520" y="45" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="528" y="35">20 Ω</text><rect x="520" y="130" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="528" y="120">20 Ω</text><rect x="685" y="180" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="600" y="222">19 Ω</text><circle cx="700" cy="300" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="693" y="307">A</text><rect x="560" y="385" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="568" y="375">1 Ω</text><circle cx="400" cy="100" r="5" fill="#3d5652"/><circle cx="400" cy="400" r="5" fill="#3d5652"/><path d="M370 340V270" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="275" y="165">P = 23 W</text></g></svg>