<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Three-branch circuit with an unknown emf</title><desc id="desc">Three horizontal branches join the same left and right nodes. The top has a 28-volt source with positive terminal left and R; the middle has an unknown source positive left and six ohms, with four amperes leftward; the bottom has three ohms and six amperes rightward.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M130 100H232 M248 100H455 M535 100H680 M130 100V350H325 M405 350H680V100 M130 220H232 M248 220H455 M535 220H680"/></g><path d="M232 78V122 M248 87V113" stroke="#3d5652" stroke-width="3"/><text x="210" y="68">28.0 V</text><text x="208" y="107">+</text><rect x="455" y="85" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="463" y="75">R</text><path d="M232 198V242 M248 207V233" stroke="#3d5652" stroke-width="3"/><text x="210" y="188">ε</text><text x="208" y="227">+</text><rect x="455" y="205" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="463" y="195">6.00 Ω</text><rect x="325" y="335" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="333" y="325">3.00 Ω</text><circle cx="365" cy="220" r="5" fill="#3d5652"/><path d="M570 165H470" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><path d="M455 305H565" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="355" y="255">x</text><text x="480" y="160">4.00 A</text><text x="480" y="302">6.00 A</text></g></svg>