<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A loaded voltage divider</title><desc id="desc">A hundred-kiloohm resistor connects a at four hundred volts to b; a two-hundred-kiloohm resistor and voltmeter are parallel between b and ground.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M220 55V110 M220 180V240 M220 240V290 M220 360V415H610V262 M220 240H610V218"/></g><rect x="205" y="110" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="249" y="152">100 kΩ</text><rect x="205" y="290" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="249" y="332">200 kΩ</text><circle cx="610" cy="240" r="22" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="603" y="247">V</text><circle cx="220" cy="240" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="190" y="45">a = 400 V</text><text x="175" y="240">b</text><text x="173" y="450">0 V</text><text x="500" y="190">Rᵥ</text></g></svg>