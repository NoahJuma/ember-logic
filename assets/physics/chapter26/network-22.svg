<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Resistor network</title><desc id="desc">Three branches share top and bottom nodes: a ten volt source, a thirty ohm resistor, and a twenty ohm resistor in series with a five volt source. Both sources have positive terminals at the top.</desc><rect width="700" height="400" rx="16" fill="#f4f7f4"/><path d="M90 70 H590 M90 320 H590 M90 70 V175 M90 205 V320 M350 70 V155 M350 235 V320 M590 70 V125 M590 205 V265 M590 295 V320 M70 175 H110 M78 205 H102 M570 265 H610 M578 295 H602" fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(350 195) rotate(90)" fill="none" stroke="#a44e39" stroke-width="4"/><path d="M-40 0 l10 -12 l14 24 l14 -24 l14 24 l14 -24 l14 12" transform="translate(590 165) rotate(90)" fill="none" stroke="#a44e39" stroke-width="4"/><g fill="#183239" font-family="sans-serif" text-anchor="middle" font-size="21"><text x="53" y="195">10.0 V</text><text x="72" y="165">+</text><text x="390" y="205">30.0 Ω</text><text x="630" y="175">20.0 Ω</text><text x="635" y="290">5.00 V</text><text x="570" y="257">+</text></g></svg>