<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A three-branch Kirchhoff circuit</title><desc id="desc">Three branches connect nodes a and b. The top has one ohm, a twenty-volt source positive on the left, and six ohms. The middle has four ohms, one ohm and source epsilon one positive left. The bottom has one ohm, source epsilon two positive left, and two ohms.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M110 95V355 M700 95V355 M110 95H180 M260 95H332 M348 95H490 M570 95H700 M110 225H180 M260 225H380 M460 225H532 M548 225H700 M110 355H180 M260 355H332 M348 355H490 M570 355H700"/></g><rect x="180" y="80" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="188" y="70">1.00 Ω</text><path d="M332 73V117 M348 82V108" stroke="#3d5652" stroke-width="3"/><text x="310" y="63">20.0 V</text><text x="308" y="102">+</text><rect x="490" y="80" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="498" y="70">6.00 Ω</text><rect x="180" y="210" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="188" y="200">4.00 Ω</text><rect x="380" y="210" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="388" y="200">1.00 Ω</text><path d="M532 203V247 M548 212V238" stroke="#3d5652" stroke-width="3"/><text x="510" y="193">ε₁</text><text x="508" y="232">+</text><rect x="180" y="340" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="188" y="330">1.00 Ω</text><path d="M332 333V377 M348 342V368" stroke="#3d5652" stroke-width="3"/><text x="310" y="323">ε₂</text><text x="308" y="362">+</text><rect x="490" y="340" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="498" y="330">2.00 Ω</text><circle cx="110" cy="225" r="5" fill="#3d5652"/><circle cx="700" cy="225" r="5" fill="#3d5652"/><path d="M78 110V190" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><path d="M78 250V330" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="42" y="165">1 A</text><text x="42" y="305">2 A</text><text x="87" y="235">a</text><text x="710" y="235">b</text></g></svg>