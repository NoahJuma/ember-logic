<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Circuit with two resistor networks and sources</title><desc id="desc">A current of two amperes passes through a top group of four parallel branches: ten plus twenty ohms, sixty ohms, sixty ohms, and thirty ohms. The return path contains twenty ohms in parallel with fifteen ohms and an unknown source. The circuit also contains two five-ohm resistors and five- and ten-volt sources.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M65 160H275 M275 80V245 M275 80H300 M380 80H415 M495 80H555 M275 135H360 M440 135H555 M275 190H360 M440 190H555 M275 245H360 M440 245H555 M555 80V245 M555 160H615 M695 160H750 V250 M750 266V410H610 M610 410H510 M430 410H400 M400 360V410 M400 360H430 M510 360H540 M556 360H610 V410 M400 410H65 V327 M65 257V238 M65 222V160"/></g><rect x="300" y="65" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="308" y="55">10 Ω</text><rect x="415" y="65" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="423" y="55">20 Ω</text><rect x="360" y="120" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="368" y="110">60 Ω</text><rect x="360" y="175" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="368" y="165">60 Ω</text><rect x="360" y="230" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="368" y="220">30 Ω</text><rect x="615" y="145" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="623" y="135">5 Ω</text><path d="M728 250H772 M737 266H763" stroke="#3d5652" stroke-width="3"/><text x="782" y="265">10 V</text><text x="712" y="240">+</text><path d="M43 222H87 M52 238H78" stroke="#3d5652" stroke-width="3"/><text x="97" y="237">5 V</text><text x="27" y="212">+</text><rect x="50" y="257" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="94" y="299">5 Ω</text><rect x="430" y="395" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="438" y="385">20 Ω</text><rect x="430" y="345" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="438" y="335">15 Ω</text><path d="M556 338V382 M540 347V373" stroke="#3d5652" stroke-width="3"/><text x="518" y="328">ε</text><text x="564" y="367">+</text><circle cx="275" cy="160" r="5" fill="#3d5652"/><circle cx="555" cy="160" r="5" fill="#3d5652"/><circle cx="400" cy="410" r="5" fill="#3d5652"/><circle cx="610" cy="410" r="5" fill="#3d5652"/><path d="M150 130H250" fill="none" stroke="#08788a" stroke-width="3" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="165" y="120">2.00 A</text></g></svg>