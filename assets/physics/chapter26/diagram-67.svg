<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">A resistor bridge with a switch</title><desc id="desc">The upper node is thirty-six volts, the lower is ground. Two resistor dividers have midpoints a and b, joined by a switch and a three-ohm resistor.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M165 75H630 M165 405H630 M165 75V125 M165 195V285 M165 355V405 M630 75V125 M630 195V285 M630 355V405 M165 240H280 M360 240H455 M525 240H630"/></g><rect x="150" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="194" y="167">6.00 Ω</text><rect x="150" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="194" y="327">3.00 Ω</text><rect x="615" y="125" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="530" y="167">3.00 Ω</text><rect x="615" y="285" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="530" y="327">6.00 Ω</text><rect x="280" y="225" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="288" y="215">3.00 Ω</text><circle cx="165" cy="240" r="5" fill="#3d5652"/><circle cx="630" cy="240" r="5" fill="#3d5652"/><circle cx="455" cy="240" r="5" fill="#3d5652"/><circle cx="525" cy="240" r="5" fill="#3d5652"/><path d="M455 240L510 215" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="105" y="62">36.0 V</text><text x="100" y="429">0 V</text><text x="140" y="230">a</text><text x="645" y="230">b</text><text x="482" y="199">S</text></g></svg>