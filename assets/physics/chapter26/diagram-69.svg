<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Leaky dielectric capacitor equivalent circuit</title><desc id="desc">A capacitor whose dielectric has permittivity factor kappa and resistivity rho is modeled by C and a leakage resistor R in parallel. A switch disconnects the charging source.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M110 115V225 M110 241V370H310 M310 370H620 M310 115H620 M310 115V198 M310 214V370 M620 115V205 M620 275V370"/></g><path d="M88 225H132 M97 241H123" stroke="#3d5652" stroke-width="3"/><text x="142" y="240">ε</text><text x="72" y="215">+</text><path d="M288 198H332 M288 214H332" stroke="#3d5652" stroke-width="3"/><text x="341" y="213">C</text><rect x="605" y="205" width="30" height="70" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="520" y="247">R</text><circle cx="310" cy="115" r="5" fill="#3d5652"/><circle cx="310" cy="370" r="5" fill="#3d5652"/><circle cx="110" cy="115" r="5" fill="#3d5652"/><circle cx="310" cy="115" r="5" fill="#3d5652"/><path d="M110 115L285 85" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="160" y="75">S</text><text x="330" y="172">κ, ρ</text><text x="325" y="245">A, d</text></g></svg>