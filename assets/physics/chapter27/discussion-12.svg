<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc"><title id="title">Velocities at the corners of a cube in a uniform magnetic field</title><desc id="desc">The magnetic field points in positive x. Velocities a, b, c, d and e point along positive y, positive z, negative x, positive x minus z, and positive y minus z, respectively.</desc><defs><marker id="vec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b9472"/></marker><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="450" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M350 220L500 255L375 310L225 275Z M350 80L500 115L375 170L225 135Z M350 220V80 M500 255V115 M375 310V170 M225 275V135" fill="none" stroke="#9eafa8" stroke-width="2"/><path d="M350 220L540 264" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#axis)"/><path d="M350 220V40" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#axis)"/><path d="M350 220L160 304" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#axis)"/><text x="548" y="272">x</text><text x="340" y="32">y</text><text x="140" y="315">z</text><path d="M350 220V150" fill="none" stroke="#4b9472" stroke-width="4" marker-end="url(#vec)"/><path d="M350 80L280 111" fill="none" stroke="#4b9472" stroke-width="4" marker-end="url(#vec)"/><path d="M375 170L300 152" fill="none" stroke="#4b9472" stroke-width="4" marker-end="url(#vec)"/><path d="M225 135L330 127" fill="none" stroke="#4b9472" stroke-width="4" marker-end="url(#vec)"/><path d="M375 310L430 224" fill="none" stroke="#4b9472" stroke-width="4" marker-end="url(#vec)"/><g fill="#c4564c"><circle cx="350" cy="220" r="5"/><circle cx="350" cy="80" r="5"/><circle cx="375" cy="170" r="5"/><circle cx="225" cy="135" r="5"/><circle cx="375" cy="310" r="5"/></g><text x="360" y="240">a</text><text x="360" y="75">b</text><text x="385" y="173">c</text><text x="205" y="132">d</text><text x="385" y="329">e</text><path d="M485 60L585 83" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#axis)"/><text x="480" y="48">B ∥ +x</text><text x="426" y="405" font-size="17">schematic / schematisk</text></g></svg>
