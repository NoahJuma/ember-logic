<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A hinged rectangular current loop</title><desc id="desc">A rectangular loop pivots along its six-centimetre upper side on the z axis. The loop is tilted thirty degrees from the vertical yz plane toward positive x.</desc><defs><marker id="mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker><marker id="cur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M390 90V25 M390 90L570 135 M390 90L245 210" fill="none" stroke="#536b67" stroke-width="2"/><path d="M390 90L270 190L420 350L540 250Z" fill="none" stroke="#bb8749" stroke-width="7"/><path d="M270 190V350 M390 90V250" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M365 110L295 170" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M290 210L365 290" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M430 340L510 275" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M525 234L415 116.67" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="382" y="20">y</text><text x="580" y="140">x</text><text x="228" y="225">z</text><text x="372" y="85">a</text><text x="245" y="190">b</text><text x="270" y="155">6.00 cm</text><text x="255" y="280">8.00 cm</text><text x="300" y="235">30.0°</text></g></svg>