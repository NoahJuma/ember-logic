<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A current-carrying ribbon and Hall field</title><desc id="desc">A ribbon carries current along x; its width is along z and its thickness and magnetic field are along y.</desc><defs><marker id="mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker><marker id="cur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M170 250L440 305L600 235L330 180Z" fill="#f0d6a8" stroke="#536b67" stroke-width="2"/><path d="M170 250V280L440 335V305 M440 335L600 265V235" fill="#e7c08d" stroke="#536b67" stroke-width="2"/><path d="M330 240V90" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#mag)"/><path d="M480 295L625 325" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M170 280L110 330 M170 280V195 M170 280L285 302" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="325" y="80">y, B</text><text x="630" y="333">x, I</text><text x="95" y="350">z</text><text x="260" y="320">0.23 mm</text><text x="190" y="203">11.8 mm</text></g></svg>