<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img" aria-labelledby="title desc">
<title id="title">Magnetic forces on a hinged current loop</title><desc id="desc">Force on the left hinged side is into the page and force on the right side is out of the page, each 1.20 newtons. The upper and lower sides experience zero magnetic force.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#176878"/></marker></defs><rect width="850" height="450" rx="16" fill="#f5f8f5"/>
<path d="M255 120 H595 V300 H255 Z" fill="none" stroke="#24464a" stroke-width="4"/><path d="M245 110 V310" fill="none" stroke="#a45537" stroke-width="9"/>
<g fill="none" stroke="#176878" stroke-width="4" marker-end="url(#arr)"><path d="M360 120 H430"/><path d="M595 165 V235"/><path d="M490 300 H420"/><path d="M255 255 V185"/><path d="M275 50 H575"/></g>
<g font-family="system-ui,sans-serif" font-size="22" fill="#193e44"><text x="590" y="57">B</text><text x="215" y="112">b</text><text x="215" y="326">a</text><text x="607" y="112">c</text><text x="607" y="326">d</text><text x="362" y="101">F<tspan baseline-shift="sub" font-size="16">bc</tspan> = 0</text><text x="361" y="345">F<tspan baseline-shift="sub" font-size="16">ad</tspan> = 0</text><text x="46" y="201">F<tspan baseline-shift="sub" font-size="16">ab</tspan> = 1.20 N</text><text x="670" y="201">F<tspan baseline-shift="sub" font-size="16">cd</tspan> = 1.20 N</text><text x="140" y="247" font-size="48">⊗</text><text x="654" y="247" font-size="48">⊙</text></g>
</svg>
