<rect width="860" height="430" rx="18" fill="#f4f8f5"/>
<g fill="none" stroke="#225058" stroke-width="5"><circle cx="215" cy="220" r="110"/><circle cx="645" cy="220" r="110"/></g>
<g fill="none" stroke="#225058" stroke-width="5" marker-end="url(#arrowI)"><path d="M281 132 A110 110 0 0 0 188 113"/><path d="M579 132 A110 110 0 0 1 672 113"/></g>
<g fill="none" stroke="#be593b" stroke-width="4" marker-end="url(#arrowF)"><path d="M215 105 V55"/><path d="M330 220 H383"/><path d="M215 335 V390"/><path d="M100 220 H48"/><path d="M645 105 V55"/><path d="M760 220 H812"/><path d="M645 335 V390"/><path d="M530 220 H478"/></g>
