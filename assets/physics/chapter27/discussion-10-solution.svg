<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
<title id="title">Current loops expanding in a magnetic field</title><desc id="desc">Seen from above, a counterclockwise current with the field out of the page and a clockwise current with the field into the page each have outward magnetic forces.</desc>
