<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Rectangular loop pivoted about the y axis</title><desc id="desc">A vertical rectangular loop pivots about its left side along y. Its width lies in the xz plane at 30 degrees from positive x toward positive z, with current up the pivot side.</desc><defs><marker id="mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker><marker id="cur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M300 340V80" fill="none" stroke="#536b67" stroke-width="2"/><path d="M300 340L525 380 M300 340L175 420" fill="none" stroke="#536b67" stroke-width="2"/><path d="M300 340V130L420 185V395Z" fill="none" stroke="#bb8749" stroke-width="7"/><path d="M282 310V175" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M330 144L395 174" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M440 215V320" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><path d="M397 376L330 350" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="292" y="67">y</text><text x="532" y="390">x</text><text x="158" y="430">z</text><text x="165" y="230">8.00 cm</text><text x="330" y="405">6.00 cm</text><text x="350" y="320">30.0°</text><text x="447" y="252">15.0 A</text></g></svg>