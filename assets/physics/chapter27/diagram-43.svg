<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A shunt-wound motor</title><desc id="desc">The field coil and rotor are connected as parallel branches across a 230-volt supply.</desc><defs><marker id="mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker><marker id="cur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M140 100H620 M140 350H620 M140 100V350 M360 100V190 M360 260V350 M600 100V198 M600 282V350" fill="none" stroke="#536b67" stroke-width="2"/><rect x="345" y="190" width="30" height="70" fill="#fffdf7" stroke="#536b67" stroke-width="3"/><circle cx="600" cy="240" r="42" fill="#fffdf7" stroke="#536b67" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="65" y="235">230 V</text><text x="382" y="220">R_f = 215 Ω</text><text x="470" y="330">R_r = 6.3 Ω</text><text x="590" y="247">M</text></g></svg>