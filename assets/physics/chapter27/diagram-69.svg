<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Loudspeaker voice coil in an outward magnetic field</title><desc id="desc">A circular coil surrounds the y axis. Magnetic field vectors point outward at 60 degrees from the coil normal; current circulates around the coil.</desc><defs><marker id="mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker><marker id="cur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><ellipse cx="380" cy="270" rx="150" ry="45" fill="none" stroke="#bb8749" stroke-width="8"/><ellipse cx="380" cy="250" rx="150" ry="45" fill="none" stroke="#bb8749" stroke-width="8"/><path d="M380 340V70" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M290 245L180 181" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#mag)"/><path d="M470 245L580 181" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#mag)"/><path d="M320 289Q380 315 440 289" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#cur)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="390" y="70">y</text><text x="155" y="175">B</text><text x="585" y="175">B</text><text x="245" y="210">60°</text><text x="485" y="210">60°</text><text x="455" y="312">I</text></g></svg>