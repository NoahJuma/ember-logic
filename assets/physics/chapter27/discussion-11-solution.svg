<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc"><title id="title">Magnetic deflection of equal-mass particles</title><desc id="desc">For initially rightward motion in a field into the page, positive charges curve upward, a negative charge curves downward, and a neutral particle continues straight. Twice the positive speed gives twice the radius.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="390" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><g fill="#b0c3b8"><text x="260" y="65">×</text><text x="365" y="65">×</text><text x="470" y="65">×</text><text x="575" y="65">×</text><text x="260" y="340">×</text><text x="365" y="340">×</text><text x="470" y="340">×</text><text x="575" y="340">×</text></g><text x="28" y="55">B: ×</text><path d="M50 200H150" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#arr)"/><path d="M150 200Q270 200 380 90 M150 200Q315 200 510 130 M150 200H520 M150 200Q270 200 380 310" fill="none" stroke-width="4"/><path d="M150 200Q270 200 380 90" fill="none" stroke="#c4564c" stroke-width="4" marker-end="url(#arr)"/><path d="M150 200Q315 200 510 130" fill="none" stroke="#a77a2f" stroke-width="4" marker-end="url(#arr)"/><path d="M150 200H520" fill="none" stroke="#315b60" stroke-width="4" marker-end="url(#arr)"/><path d="M150 200Q270 200 380 310" fill="none" stroke="#4b6fa0" stroke-width="4" marker-end="url(#arr)"/><text x="390" y="85">+q, v</text><text x="520" y="135">+q, 2v</text><text x="530" y="207">q = 0</text><text x="390" y="320">−q, v</text><text x="28" y="370" font-size="17">schematic / schematisk</text></g></svg>
