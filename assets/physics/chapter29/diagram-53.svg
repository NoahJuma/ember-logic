<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Flux through a radial rectangle inside a wire</title><desc id="desc">A long cylindrical wire carries uniformly distributed current I zero. The highlighted rectangle extends from the axis to the surface, over length W.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M170 160L530 95Q590 115 590 190L230 255Z" fill="#f4e4b8" fill-opacity="0.65" stroke="#536b67" stroke-width="2"/><ellipse cx="200" cy="208" rx="40" ry="60" transform="rotate(-20 200 208)" fill="#f4e4b8" stroke="#536b67" stroke-width="2"/><path d="M200 208L550 145L565 172L215 235Z" fill="#d98b8b" fill-opacity="0.55" stroke="#a95a5a" stroke-width="2"/><path d="M235 190L480 145" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M200 208L215 235 M230 280L585 215 M230 272L230 288 M585 207L585 223" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="450" y="125">I₀</text><text x="185" y="248">R</text><text x="390" y="260">W</text></g></svg>