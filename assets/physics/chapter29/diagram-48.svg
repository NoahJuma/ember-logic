<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Rotating loop in a magnetic field</title><desc id="desc">A loop lies in the yz plane; the magnetic field points along positive x, normal to the loop. Rotation about y, x, or an edge parallel to z is considered.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M220 155L510 120L510 315L220 350Z" fill="#f4e4b8" fill-opacity="0.5" stroke="#bb8749" stroke-width="8"/><path d="M365 390V50 M100 260L650 195 M180 100L570 365" fill="none" stroke="#536b67" stroke-width="2"/><path d="M365 225L495 300" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="376" y="48">z</text><text x="655" y="200">y</text><text x="575" y="377">x</text><text x="480" y="315">B</text><text x="225" y="380">A = 600 cm²</text><text x="535" y="150">ω = 35.0 rad/s</text></g></svg>