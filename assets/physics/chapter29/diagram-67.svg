<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Rotating conducting sphere with two contacts</title><desc id="desc">A conducting sphere rotates around its vertical axis in a downward magnetic field. Brushes touch at the north pole and at sixty degrees from it; a resistor connects the brushes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><circle cx="335" cy="235" r="135" fill="#f4e4b8" stroke="#536b67" stroke-width="2"/><path d="M335 100V35 H470 L478 28 L486 42 L494 28 L502 42 L510 35 H520 V128 M335 235L452 168 L520 128 M325 235H345 M335 225V245" fill="none" stroke="#536b67" stroke-width="2"/><path d="M175 75V190" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M335 235H470" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M315 92Q355 65 385 100" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="135" y="65">B ↓</text><text x="270" y="335">r = 0.100 m</text><text x="350" y="155">60°</text><text x="385" y="90">f = 2.00 Hz</text><text x="505" y="67">10.0 Ω</text></g></svg>