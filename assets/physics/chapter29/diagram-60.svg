<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Concentric coils and a charged capacitor</title><desc id="desc">A large circular coil of radius a is connected through a switch to a charged capacitor. A small closed coil of radius b is concentric and parallel to it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M575 215 A225 80 0 1 0 350 295" fill="none" stroke="#bb8749" stroke-width="9"/><ellipse cx="350" cy="210" rx="45" ry="18" fill="none" stroke="#536b67" stroke-width="5"/><path d="M575 215H610V145H630 M630 145L650 135 M660 145H690V200 M680 200H700 M680 220H700 M690 220V315H350V295" fill="none" stroke="#536b67" stroke-width="2"/><path d="M350 330H575 M350 320V340 M575 320V340" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="145" y="125">N₁, a</text><text x="315" y="205">N₂, b</text><text x="706" y="215">C</text><text x="625" y="120">S</text><text x="450" y="355">a</text><text x="702" y="195">+</text></g></svg>