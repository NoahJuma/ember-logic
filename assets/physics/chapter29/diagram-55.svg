<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Moving rod and loop near a straight wire</title><desc id="desc">A horizontal wire carries current to the right. A rod and a rectangular loop move right below it. Their upper edges are distance d from the wire and their heights are L.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M95 100H665" fill="none" stroke="#bb8749" stroke-width="10"/><path d="M180 72H360" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M230 195V340 M510 195V340 H615 V195 Z" fill="none" stroke="#bb8749" stroke-width="9"/><path d="M245 265H330" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M625 265H700" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M190 100V195 M180 100H200 M180 195H200 M185 195V340 M175 340H195 M470 100V195 M460 100H480 M460 195H480 M455 195V340 M445 340H465" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="260" y="60">I</text><text x="165" y="158">d</text><text x="160" y="275">L</text><text x="236" y="190">a</text><text x="236" y="365">b</text><text x="295" y="255">v</text><text x="445" y="158">d</text><text x="430" y="275">L</text><text x="650" y="255">v</text><text x="215" y="400">(a)</text><text x="535" y="400">(b)</text></g></svg>