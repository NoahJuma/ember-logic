<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Rectangular loop in a changing electric field</title><desc id="desc">A uniform electric field points along the cylindrical axis and increases as eta t squared. A rectangular loop of width a extends radially from the axis and has axial height b and resistance R.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M180 100Q380 35 580 100V350Q380 415 180 350Z" fill="#f4d7e3" fill-opacity="0.6" stroke="#ba7199" stroke-width="2"/><ellipse cx="380" cy="100" rx="200" ry="55" fill="none" stroke="#ba7199" stroke-width="2"/><ellipse cx="380" cy="350" rx="200" ry="55" fill="none" stroke="#ba7199" stroke-width="2"/><path d="M380 50V390" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M380 180H485 L493 173 L501 187 L509 173 L517 187 L525 180 H560V295H380V180" fill="none" stroke="#536b67" stroke-width="2"/><path d="M245 125V60" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M320 125V60" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M440 125V60" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M515 125V60" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="450" y="60">E = ηt² k</text><text x="515" y="160">R</text><text x="465" y="320">a</text><text x="570" y="245">b</text><text x="390" y="240">z</text></g></svg>