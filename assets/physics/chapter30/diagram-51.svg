<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Motor spool held by a bar</title><desc id="desc">A cylindrical coil has a vertical magnetic moment and is held by a bar that applies a downward force on its rim. The magnetic field is forty-five degrees to the moment; the spool rotates about a transverse diameter.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M240 260V340 M560 260V340 M560 250H660 M385 310L270 405 M475 250L560 155"/></g><path d="M240 260 A160 48 0 0 1 560 260 V340 A160 48 0 0 1 240 340Z" fill="#f4e4b8" stroke="#3d5652" stroke-width="3"/><ellipse cx="400" cy="260" rx="160" ry="48" fill="#e7e1d3" stroke="#3d5652" stroke-width="3"/><path d="M240 280 Q400 375 560 280" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M240 295 Q400 390 560 295" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M240 310 Q400 405 560 310" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M240 325 Q400 420 560 325" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M240 340 Q400 435 560 340" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M400 260H560" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="6 4"/><path d="M400 255V105" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M400 255L300 145" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><path d="M560 260V335" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#ar)"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="410" y="115">μ</text><text x="265" y="145">B</text><text x="580" y="335">F</text><text x="340" y="202">45°</text><text x="480" y="250">a</text></g></svg>