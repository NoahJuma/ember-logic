<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Inductive liquid-level gauge</title><desc id="desc">A coil surrounds a tank of total height D, containing liquid to height d. The inductance depends on the fraction filled.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M235 95H575 V370 H235 Z M210 95V370 M200 95H220 M200 370H220 M190 255V370 M180 255H200 M180 370H200"/></g><rect x="237" y="255" width="336" height="113" fill="#c9e8ed"/><path d="M300 95 C270 150 310 300 275 370" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M390 95 C360 150 400 300 365 370" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M480 95 C450 150 490 300 455 370" fill="none" stroke="#bb8749" stroke-width="4"/><path d="M565 95 C535 150 575 300 540 370" fill="none" stroke="#bb8749" stroke-width="4"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="155" y="225">D</text><text x="145" y="320">d</text><text x="350" y="180"> </text><text x="345" y="325"> </text><text x="610" y="210">L(d)</text><text x="600" y="245">L₀</text><text x="600" y="280">Lᶠ</text></g></svg>