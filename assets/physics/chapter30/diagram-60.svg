<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Switched LC circuit</title><desc id="desc">Initially switch S one is closed and S two open; the inductor has current three point five amperes. Then S one opens and S two closes, connecting the inductor and capacitor as an isolated loop.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M100 100H205 M255 100H500 M500 100H560 M620 100H710 V242 M710 258V390H100 V345 M100 285V258 M100 242V100 M500 100V185 M500 265V390"/></g><path d="M78 242H122 M87 258H113" stroke="#3d5652" stroke-width="3"/><text x="130" y="257">ε</text><text x="60" y="234">+</text><rect x="85" y="285" width="30" height="60" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="124" y="322">R</text><path d="M500 185 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20" fill="none" stroke="#3d5652" stroke-width="3"/><text x="525" y="232">2.0 mH</text><path d="M688 242H732 M688 258H732" stroke="#3d5652" stroke-width="3"/><text x="740" y="257">5.0 μF</text><circle cx="500" cy="100" r="5" fill="#3d5652"/><circle cx="500" cy="390" r="5" fill="#3d5652"/><circle cx="205" cy="100" r="5" fill="#3d5652"/><circle cx="255" cy="100" r="5" fill="#3d5652"/><path d="M205 100H255 M560 100L610 80" stroke="#3d5652" stroke-width="3"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="205" y="72">S₁</text><text x="560" y="72">S₂</text><text x="215" y="430">I₀ = 3.50 A</text></g></svg>