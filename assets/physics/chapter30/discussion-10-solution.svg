<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="title desc"><title id="title">Inductor voltage for triangular current</title><desc id="desc">With the passive voltage convention, the voltage is constant and positive on each rising current ramp and equally negative on each falling ramp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="300" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="22" fill="#263f40" stroke-linecap="round"><path d="M100 150H625" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M100 245V50" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M100 90H180V210H260V90H340V210H420V90H500V210H580" fill="none" stroke="#b45f52" stroke-width="4"/><text x="30" y="43">v_L</text><text x="630" y="158">t</text><text x="78" y="173">0</text></g></svg>
