<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">Resistor and inductor branches</title><desc id="desc">A fifty-volt battery and one-hundred-ohm series resistor feed two parallel branches: a fifty-ohm resistor, and a fifteen-millihenry inductor in series with seventy-five ohms. Voltages V one through V four are across those components.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="480" fill="#fffdf7"/><g fill="none" stroke="#3d5652" stroke-width="3"><path d="M100 100H125 M165 100H210 M290 100H710 V155 M710 215V390H100 V258 M100 242V100 M440 100V155 M440 235V260 M440 320V390"/></g><path d="M125 100L155 85" stroke="#3d5652" stroke-width="3"/><path d="M78 242H122 M87 258H113" stroke="#3d5652" stroke-width="3"/><text x="130" y="257">50.0 V</text><text x="60" y="234">+</text><rect x="210" y="85" width="80" height="30" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="216" y="75">100 Ω</text><path d="M440 155 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20 c-22 0 -22 20 0 20" fill="none" stroke="#3d5652" stroke-width="3"/><text x="465" y="202">15.0 mH</text><rect x="425" y="260" width="30" height="60" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="464" y="297">75.0 Ω</text><rect x="695" y="155" width="30" height="60" fill="#fffdf7" stroke="#3d5652" stroke-width="3"/><text x="602" y="192">50.0 Ω</text><circle cx="440" cy="100" r="5" fill="#3d5652"/><circle cx="440" cy="390" r="5" fill="#3d5652"/><g font-family="sans-serif" font-size="19" fill="#263c3a"><text x="205" y="145">V₁</text><text x="485" y="228">V₂</text><text x="485" y="323">V₃</text><text x="610" y="220">V₄</text></g></svg>