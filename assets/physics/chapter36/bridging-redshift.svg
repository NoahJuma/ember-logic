<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Galaxy light diffracted by a grating</title><desc id="desc">Parallel galaxy light travels toward a transmission grating. The first-order rays lie at plus and minus 23.41 degrees to the grating normal, with zero order in the center.</desc><defs><marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="400" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M65 200H320" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#ray)"/><path d="M320 70V330" stroke="#6e9180" stroke-width="7"/><path d="M320 200H580" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#ray)"/><path d="M320 200L540 105" fill="none" stroke="#c4564c" stroke-width="3" marker-end="url(#ray)"/><path d="M320 200L540 295" fill="none" stroke="#c4564c" stroke-width="3" marker-end="url(#ray)"/><text x="85" y="180">Hα</text><text x="250" y="365">5758 lines/cm</text><text x="580" y="108">m = +1</text><text x="585" y="207">m = 0</text><text x="580" y="300">m = −1</text><text x="405" y="145">23.41°</text><text x="405" y="275">23.41°</text><text x="70" y="45" font-size="17">schematic / schematisk</text></g></svg>
