<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="title desc"><title id="title">Photon backscattering from a stationary electron</title><desc id="desc">Initially a photon travels right toward an electron at rest. After scattering, the photon travels left and the electron recoils right.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="330" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><text x="50" y="48">before / före</text><path d="M85 110H265" fill="none" stroke="#a45284" stroke-width="4" marker-end="url(#arr)"/><text x="125" y="88">photon: λ</text><circle cx="370" cy="110" r="18" fill="#c6dcf0"/><text x="360" y="117">e⁻</text><text x="420" y="117">v = 0</text><text x="50" y="195">after / efter</text><circle cx="370" cy="260" r="18" fill="#c6dcf0"/><text x="360" y="267">e⁻</text><path d="M320 260H110" fill="none" stroke="#a45284" stroke-width="4" marker-end="url(#arr)"/><path d="M395 260H570" fill="none" stroke="#315b60" stroke-width="4" marker-end="url(#arr)"/><text x="135" y="240">photon: λ′</text><text x="440" y="240">pₑ</text></g></svg>
