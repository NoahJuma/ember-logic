<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-labelledby="title desc">
<title id="title">Compton scattering momentum directions</title>
<desc id="desc">An incoming photon travels right. The scattered photon travels 60 degrees above its direction and the recoiling electron about 59.4 degrees below it.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs>
<rect width="660" height="350" rx="18" fill="#f4f8f7"/>
<path d="M54 175 H280" fill="none" stroke="#1e6d79" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M280 175 L363 31" fill="none" stroke="#1e6d79" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M280 175 L363 316" fill="none" stroke="#b85b31" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M280 175 H470" fill="none" stroke="#73807c" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M342 175 A62 62 0 0 0 311 121" fill="none" stroke="#41646b" stroke-width="2"/>
<path d="M342 175 A62 62 0 0 1 312 228" fill="none" stroke="#9c5b3f" stroke-width="2"/>
<circle cx="280" cy="175" r="6" fill="#263c40"/>
<g fill="#233b40" font-family="Arial, sans-serif" font-size="22"><text x="75" y="158">p = h/λ</text><text x="380" y="41">p′ = h/λ′</text><text x="382" y="319">pₑ</text><text x="345" y="143">60°</text><text x="344" y="218">≈ 59.4°</text></g>
</svg>
