<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" role="img" aria-labelledby="title desc"><title id="title">Photoelectric circuit and printed source polarities</title><desc id="desc">Light strikes a cathode connected at left. An anode at right connects through an ammeter. The electrodes are bridged by variable resistor R. The left junction connects through a one kiloohm resistor and a switch to one of two fifteen volt sources: at a the positive terminal is on the right, at b it is on the left.</desc><rect width="500" height="620" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3"><path d="M100 140 V275 H160 M275 275 H400 V140 M100 275 V320 M100 376 V410 M100 445 V535 H235 M265 535 H400 V275 M150 435 H235 M265 435 H400 M100 410 L136 429"/><path d="M160 275 l10 -12 l16 24 l16 -24 l16 24 l16 -24 l16 24 l12 -12 h13 M100 320 l-12 9 l24 14 l-24 14 l24 14 l-12 5" stroke="#a44e39" stroke-width="4"/><path d="M235 520 V550 M265 512 V558 M235 412 V458 M265 420 V450" stroke="#236b77" stroke-width="4"/><circle cx="100" cy="410" r="5" fill="#263d42"/><circle cx="100" cy="445" r="5" fill="#263d42"/><circle cx="150" cy="435" r="5" fill="#263d42"/><circle cx="400" cy="200" r="24" fill="#f4f7f4"/><path d="M100 140 H165 M335 140 H400"/><path d="M165 95 V185 M335 95 V185" stroke="#b48b32" stroke-width="9"/><path d="M240 36 l-35 45 m0 0 l2 -16 m-2 16 l15 -5" stroke="#a44e39" stroke-width="4"/><path d="M210 235 V255 M203 248 L210 255 L217 248" stroke="#a44e39" stroke-width="3"/><path d="M205 140 H300 M288 132 L300 140 L288 148 M250 305 H320 M308 297 L320 305 L308 313 M450 230 V165 M442 177 L450 165 L458 177" stroke="#236b77" stroke-width="3"/></g><g font-family="sans-serif" font-size="20" fill="#183239"><text x="66" y="90">C</text><text x="340" y="90">A</text><text x="392" y="207">A</text><text x="232" y="250">R</text><text x="29" y="352">1 kΩ</text><text x="81" y="469">a</text><text x="152" y="422">b</text><text x="270" y="510">+</text><text x="212" y="420">+</text><text x="300" y="465">15.0 V</text><text x="300" y="565">15.0 V</text><text x="245" y="36">λ</text><text x="230" y="130">e⁻</text><text x="328" y="311">I</text><text x="458" y="195">i</text><text x="175" y="205" font-size="16">V<tspan baseline-shift="sub" font-size="12">AC</tspan> = V<tspan baseline-shift="sub" font-size="12">A</tspan> − V<tspan baseline-shift="sub" font-size="12">C</tspan></text></g></svg>
