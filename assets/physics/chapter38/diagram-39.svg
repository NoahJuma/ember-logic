<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Pair production with a recoiling target</title><desc id="desc">Before the collision, a photon approaches a stationary target of mass M. Afterwards, the target moves forward and an electron and positron travel at equal speeds at opposite angles phi.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><path d="M410 60V390" fill="none" stroke="#c5ccc8" stroke-width="2"/><g stroke="#ad488b" fill="none" stroke-width="4" marker-end="url(#a)"><path d="M80 220 Q100 185 120 220 T160 220 T200 220 H245"/><path d="M520 220H710"/><path d="M520 220L650 90"/><path d="M520 220L650 350"/></g><g fill="none" stroke="#536b67" stroke-width="2"><path d="M580 220 A60 60 0 0 0 562 178 M580 220 A60 60 0 0 1 562 262"/></g><circle cx="310" cy="220" r="25" fill="#f0c975" stroke="#536b67" stroke-width="2"/><circle cx="555" cy="220" r="20" fill="#f0c975" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="21" fill="#263f3b"><text x="295" y="227">M</text><text x="541" y="227">M</text><text x="125" y="265">λ</text><text x="700" y="210">V</text><text x="655" y="83">e⁻, v</text><text x="655" y="370">e⁺, v</text><text x="578" y="190">φ</text><text x="578" y="260">φ</text><text x="145" y="395">t &lt; 0</text><text x="570" y="395">t &gt; 0</text></g></svg>
