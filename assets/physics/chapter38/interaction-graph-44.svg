<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img"><title>Relative interaction probabilities</title><desc>Approximate reconstruction of the book’s logarithmic graph. Compton scattering dominates at MeV energies, while photoelectric absorption dominates at lower energies.</desc><rect width="700" height="420" fill="#fffdf8"/><path d="M100.00 45.00L100.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="80.0" y="370" font-family="sans-serif" font-size="14" fill="#333">0.001</text><path d="M200.00 45.00L200.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="180.0" y="370" font-family="sans-serif" font-size="14" fill="#333">0.01</text><path d="M300.00 45.00L300.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="280.0" y="370" font-family="sans-serif" font-size="14" fill="#333">0.1</text><path d="M400.00 45.00L400.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="380.0" y="370" font-family="sans-serif" font-size="14" fill="#333">1</text><path d="M500.00 45.00L500.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="480.0" y="370" font-family="sans-serif" font-size="14" fill="#333">10</text><path d="M600.00 45.00L600.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="580.0" y="370" font-family="sans-serif" font-size="14" fill="#333">100</text><path d="M100.00 45.00L600.00 45.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="50.0" font-family="sans-serif" font-size="14" fill="#333">10⁴</text><path d="M100.00 105.00L600.00 105.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="110.0" font-family="sans-serif" font-size="14" fill="#333">10¹</text><path d="M100.00 165.00L600.00 165.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="170.0" font-family="sans-serif" font-size="14" fill="#333">10⁻²</text><path d="M100.00 225.00L600.00 225.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="230.0" font-family="sans-serif" font-size="14" fill="#333">10⁻⁵</text><path d="M100.00 285.00L600.00 285.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="290.0" font-family="sans-serif" font-size="14" fill="#333">10⁻⁸</text><path d="M100.00 345.00L600.00 345.00" fill="none" stroke="#ddd" stroke-width="1" /><text x="37" y="350.0" font-family="sans-serif" font-size="14" fill="#333">10⁻¹¹</text><path d="M100.00 45.00L100.00 345.00" fill="none" stroke="#333" stroke-width="2" /><path d="M100.00 345.00L600.00 345.00" fill="none" stroke="#333" stroke-width="2" /><text x="390" y="405" font-family="sans-serif" font-size="15" fill="#333">E (MeV)</text><text x="10" y="20" font-family="sans-serif" font-size="15" fill="#333">P_rel</text><polyline points="100.0,45.0 200.0,105.0 300.0,175.5 400.0,245.0 500.0,271.0 600.0,285.0" fill="none" stroke="#b53c68" stroke-width="3"/><text x="410" y="275" font-family="sans-serif" font-size="15" fill="#333">P</text><polyline points="100.0,165.0 200.0,145.0 300.0,141.5 400.0,146.9 500.0,159.0 600.0,173.0" fill="none" stroke="#347c9c" stroke-width="3"/><text x="410" y="145" font-family="sans-serif" font-size="15" fill="#333">C</text></svg>