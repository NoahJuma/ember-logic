<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" role="img" aria-labelledby="title desc">
<title id="title">Asymmetric CO₂ stretch</title><desc id="desc">The two oxygen atoms move in the same direction while the central carbon atom moves in the opposite direction; springs represent the bonds.</desc>
<rect width="740" height="290" fill="#faf7f0"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#176478"/></marker></defs>
<g fill="none" stroke="#77695a" stroke-width="3"><path d="M148 148 H170 L180 132 L192 164 L204 132 L216 164 L228 132 L240 164 L252 132 L264 164 L276 148 H322"/><path d="M418 148 H464 L476 132 L488 164 L500 132 L512 164 L524 132 L536 164 L548 132 L560 164 L572 148 H592"/></g>
<g stroke="#744b30" stroke-width="2"><circle cx="112" cy="148" r="36" fill="#df9b75"/><circle cx="370" cy="148" r="46" fill="#b8c7bd"/><circle cx="628" cy="148" r="36" fill="#df9b75"/></g>
<g font-family="sans-serif" font-size="25" text-anchor="middle" fill="#302821"><text x="112" y="157">O</text><text x="370" y="157">C</text><text x="628" y="157">O</text><text x="112" y="242">x₁ = X<tspan baseline-shift="sub" font-size="17">O</tspan></text><text x="370" y="242">x₂ = X<tspan baseline-shift="sub" font-size="17">C</tspan></text><text x="628" y="242">x₃ = X<tspan baseline-shift="sub" font-size="17">O</tspan></text><text x="245" y="114">k</text><text x="495" y="114">k</text></g>
<g stroke="#176478" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M94 61 H130"/><path d="M418 61 H322"/><path d="M610 61 H646"/></g>
</svg>
