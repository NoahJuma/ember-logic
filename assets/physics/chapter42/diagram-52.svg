<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Candidate diatomic molecules</title><desc id="desc">Nitrogen fourteen bonded to nitrogen fourteen has separation 110 picometres; carbon twelve bonded to oxygen sixteen has 118 picometres; nitrogen fourteen bonded to oxygen sixteen has 115 picometres.</desc><rect width="820" height="450" fill="#fffdf7"/><g stroke="#536b67" stroke-width="4"><path d="M230 100H570 M230 220H570 M230 340H570"/></g><g stroke="#536b67" stroke-width="2"><circle cx="230" cy="100" r="30" fill="#9ac4d2"/><circle cx="570" cy="100" r="30" fill="#9ac4d2"/><circle cx="230" cy="220" r="30" fill="#b5b9b6"/><circle cx="570" cy="220" r="30" fill="#e7a3a3"/><circle cx="230" cy="340" r="30" fill="#9ac4d2"/><circle cx="570" cy="340" r="30" fill="#e7a3a3"/></g><g font-family="sans-serif" font-size="21" fill="#263f3b"><text x="208" y="107">¹⁴N</text><text x="548" y="107">¹⁴N</text><text x="208" y="227">¹²C</text><text x="548" y="227">¹⁶O</text><text x="208" y="347">¹⁴N</text><text x="548" y="347">¹⁶O</text><text x="350" y="85">110 pm</text><text x="350" y="205">118 pm</text><text x="350" y="325">115 pm</text></g></svg>
