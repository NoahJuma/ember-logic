<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc"><title id="title">Photon excites a semiconductor electron</title><desc id="desc">A photon excites an electron from the valence-band top to a state above the conduction-band edge. The Fermi level is at midgap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="420" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#263f40" stroke-linecap="round"><rect x="150" y="55" width="350" height="100" fill="#dcebe1"/><rect x="150" y="305" width="350" height="60" fill="#dfe8f3"/><path d="M150 155H500 M150 305H500" stroke="#315b60" stroke-width="3"/><path d="M150 230H500" stroke="#7a9287" stroke-width="2" stroke-dasharray="8 7"/><path d="M295 305V85" stroke="#a45284" stroke-width="4" marker-end="url(#arrow)"/><circle cx="295" cy="305" r="6" fill="#315b60"/><circle cx="295" cy="85" r="6" fill="#a45284"/><text x="515" y="162">E_c</text><text x="515" y="237">E_F</text><text x="515" y="312">E_v</text><text x="330" y="205">E_g = 0.230 eV</text><text x="315" y="98">final / slut</text><text x="315" y="280">Eγ</text><text x="170" y="390" font-size="17">energy levels schematic / ej skalenligt</text></g></svg>
