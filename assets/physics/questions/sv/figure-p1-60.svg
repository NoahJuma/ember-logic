<title id="title">Figur P1.60: segelbåtens väg</title><desc id="desc">Första delsträckan går 2.00 km österut. Nästa går 3.50 km i riktningen 45.0° söder om öster. Den tredje går åt nordost till Mål, som ligger 5.80 km rakt öster om Start.</desc>
