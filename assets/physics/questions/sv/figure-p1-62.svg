<title id="title">Figur P1.62: förflyttningar mellan schweiziska städer</title><desc id="desc">Vägen går från Bern till Zürich, 101 km med bäringen 52°; vidare till Lugano, 165 km med bäringen 170°; och sedan till Sion, 124 km med bäringen 282°. Bäringarna mäts medurs från norr.</desc>
