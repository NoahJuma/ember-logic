<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Circular and elliptical emblems</title><desc id="desc">A circle is compared with an ellipse of major-axis length a and minor-axis length b. Motion is parallel to the major axis, with a equal to 1.40 b.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><ellipse cx="225" cy="215" rx="90" ry="90" fill="none" stroke="#bb8749" stroke-width="5"/><ellipse cx="585" cy="215" rx="75" ry="105" fill="none" stroke="#7459a2" stroke-width="5"/><path d="M490 110V320 M480 110H500 M480 320H500 M510 350H660 M510 340V360 M660 340V360" fill="none" stroke="#536b67" stroke-width="2"/><path d="M585 395V350" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="170" y="350"> </text><text x="490" y="220">a</text><text x="580" y="375">b</text><text x="620" y="395">v ∥ a</text><text x="560" y="70">a = 1.40b</text></g></svg>