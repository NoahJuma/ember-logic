<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Spacetime region of the glowing tube</title><desc id="desc">In frame S the tube extends from minus L to zero, and is lit from time zero to T. The four events are the corners of a rectangle on axes x and ct.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><rect x="205" y="90" width="330" height="235" fill="#f3df98" stroke="#536b67" stroke-width="2"/><path d="M130 325H650 M535 390V45" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="535" cy="325" r="6" fill="#263f3b"/><circle cx="205" cy="325" r="6" fill="#263f3b"/><circle cx="535" cy="90" r="6" fill="#263f3b"/><circle cx="205" cy="90" r="6" fill="#263f3b"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="555" y="335">1</text><text x="175" y="335">2</text><text x="555" y="95">3</text><text x="175" y="95">4</text><text x="190" y="355">−L</text><text x="550" y="85">cT</text><text x="650" y="345">x</text><text x="545" y="48">ct</text></g></svg>