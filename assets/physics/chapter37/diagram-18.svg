<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Approaching ship and missile</title><desc id="desc">An approaching ship fires a missile toward an observer. The ship speed in the observer frame is 0.400 c, the missile speed relative to the ship is 0.700 c, and the distance at firing is eight million kilometres.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><path d="M100 205H240L280 225L240 245H100Z" fill="#d8e4e6" stroke="#536b67" stroke-width="3"/><path d="M620 205H720L750 225L720 245H620Z" fill="#ead3b5" stroke="#536b67" stroke-width="3"/><path d="M285 225H550" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M110 160H260" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M130 300H720 M130 290V310 M720 290V310" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="100" y="285">S</text><text x="620" y="285">O</text><text x="100" y="145">0.400c</text><text x="345" y="205">0.700c (S)</text><text x="330" y="335">8.00 × 10⁶ km</text></g></svg>