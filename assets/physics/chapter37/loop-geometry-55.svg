<g fill="#233b40" font-family="Arial,sans-serif" font-size="23"><text x="311" y="42">L</text><text x="113" y="202">H</text><text x="365" y="168">B</text><text x="280" y="235">μ</text><text x="225" y="122">I</text><text x="364" y="360">+x</text><text x="505" y="218">+z</text><text x="520" y="333">+y</text></g>
</svg>
