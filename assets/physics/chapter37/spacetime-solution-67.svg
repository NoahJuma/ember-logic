<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Spacetime region before and after a Lorentz boost</title><desc id="desc">An illustrative example with beta 0.6 and cT equal to 2L shows an illuminated tube's rectangular spacetime region becoming a parallelogram of equal area.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#344b4c"/></marker></defs>
<rect width="900" height="430" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="18" fill="#263c40"><text x="35" y="28">β = 0.6; cT = 2L</text>
<path d="M55 343H400" stroke="#344b4c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M350 365V48" stroke="#344b4c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="365">x/L</text><text x="365" y="57">ct/L</text>
<polygon points="350,343 275,343 275,193 350,193" fill="#efdc82" fill-opacity="0.7" stroke="#9b762b" stroke-width="2"/>
<g fill="#263c40"><circle cx="350" cy="343" r="4"/><circle cx="275" cy="343" r="4"/><circle cx="350" cy="193" r="4"/><circle cx="275" cy="193" r="4"/><text x="356" y="337">1</text><text x="256" y="361">2</text><text x="356" y="190">3</text><text x="256" y="190">4</text></g>
<path d="M495 343H860" stroke="#344b4c" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M805 365V48" stroke="#344b4c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="850" y="365">x′/L</text><text x="817" y="57">ct′/L</text>
<polygon points="805,343 711.25,286.75 598.75,99.25 692.5,155.5" fill="#efdc82" fill-opacity="0.7" stroke="#9b762b" stroke-width="2"/>
<g fill="#263c40"><circle cx="805" cy="343" r="4"/><circle cx="711.25" cy="286.75" r="4"/><circle cx="692.5" cy="155.5" r="4"/><circle cx="598.75" cy="99.25" r="4"/><text x="812" y="337">1</text><text x="718" y="287">2</text><text x="700" y="155">3</text><text x="580" y="96">4</text></g>
<text x="120" y="406">S: area = LcT</text><text x="560" y="406">S′: area = LcT</text></g></svg>
