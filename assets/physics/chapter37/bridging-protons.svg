<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">Two proton collisions in two frames</title><desc id="desc">In the laboratory the two protons approach with equal speeds beta c. In the left proton’s rest frame, that proton is stationary and the other approaches at 0.500 c.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="350" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><text x="45" y="50">laboratory / laboratorium</text><circle cx="180" cy="115" r="20" fill="#e3b19e"/><circle cx="520" cy="115" r="20" fill="#e3b19e"/><text x="172" y="122">p</text><text x="512" y="122">p</text><path d="M205 115H300" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#arrow)"/><path d="M495 115H400" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#arrow)"/><text x="220" y="95">+βc</text><text x="425" y="95">−βc</text><text x="45" y="205">left proton frame / vänstra protonens system</text><circle cx="180" cy="270" r="20" fill="#e3b19e"/><circle cx="520" cy="270" r="20" fill="#e3b19e"/><text x="172" y="277">p</text><text x="512" y="277">p</text><path d="M495 270H350" fill="none" stroke="#315b60" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="315">v = 0</text><text x="365" y="250">−0.500c</text></g></svg>
