<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">A lamp inside a moving rocket</title><desc id="desc">A rocket moves right at one-half the speed of light. A lamp at the center of its room emits light toward the rear wall B and front wall A.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><path d="M140 180 H620 L690 225 L620 270 H140Z" fill="#e7e1d3" stroke="#536b67" stroke-width="3"/><rect x="245" y="185" width="335" height="80" fill="#fffdf7" stroke="#536b67" stroke-width="2"/><circle cx="412" cy="225" r="16" fill="#f2d883" stroke="#536b67" stroke-width="2"/><circle cx="255" cy="225" r="5" fill="#263f3b"/><circle cx="570" cy="225" r="5" fill="#263f3b"/><path d="M450 125H650" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="260" y="214">B</text><text x="555" y="214">A</text><text x="535" y="110">0.5c</text><text x="385" y="305"> </text></g></svg>