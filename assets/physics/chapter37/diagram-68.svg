<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><title id="title">Edge-on binary star orbit</title><desc id="desc">Two equal-mass stars move in opposite directions around a common center, each on a circle of radius R. The orbit is viewed edge-on from Earth, along the direction shown.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="820" height="450" fill="#fffdf7"/><circle cx="445" cy="220" r="140" fill="none" stroke="#5383a2" stroke-width="3"/><circle cx="445" cy="80" r="14" fill="#f0c975" stroke="#536b67" stroke-width="2"/><circle cx="445" cy="360" r="14" fill="#f0c975" stroke="#536b67" stroke-width="2"/><circle cx="445" cy="220" r="4" fill="#263f3b"/><path d="M445 220L545 122" fill="none" stroke="#536b67" stroke-width="2"/><path d="M420 80H310" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M470 360H580" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M235 220H100" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="20" fill="#263f3b"><text x="548" y="150">R</text><text x="468" y="78">m</text><text x="468" y="395">m</text><text x="85" y="195">⊕</text><text x="280" y="430">i = 90°</text></g></svg>