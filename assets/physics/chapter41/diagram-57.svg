<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A rotating charged spherical shell and latitude ring</title><desc id="desc">A rotating sphere of radius R is divided into a thin latitude ring at polar angle theta. Its ring radius is r.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><circle cx="380" cy="230" r="160" fill="#efc8c4" fill-opacity="0.7" stroke="#536b67" stroke-width="2"/><ellipse cx="380" cy="170" rx="148" ry="28" fill="#d98b8b" fill-opacity="0.45" stroke="#536b67" stroke-width="2"/><path d="M380 40V420 M380 230L515 145 M380 170H528" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M295 186Q345 205 400 196" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="390" y="45">z</text><text x="410" y="208">θ</text><text x="460" y="154">r</text><text x="452" y="225">R</text><text x="300" y="275">Q, M, σ</text><text x="400" y="195">dI; R dθ</text></g></svg>