<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc"><title id="title">Occupied levels in the titanium box model</title><desc id="desc">Five occupied energy groups have sums of squared quantum numbers 3, 6, 9, 11 and 12, with 2, 6, 6, 6 and 2 electrons before the lowest-level vacancy is created.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4564c"/></marker></defs><rect width="700" height="420" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round"><path d="M150 300H385 M150 250H385 M150 200H385 M150 150H385 M150 100H385" fill="none" stroke="#315b60" stroke-width="3"/><path d="M320 106V293" fill="none" stroke="#c4564c" stroke-width="4" marker-end="url(#arrow)"/><text x="45" y="58">Σn²</text><text x="65" y="307">3</text><text x="65" y="257">6</text><text x="65" y="207">9</text><text x="55" y="157">11</text><text x="55" y="107">12</text><text x="330" y="215" fill="#a34f44">ΔE</text><text x="410" y="307">2 e⁻</text><text x="410" y="257">6 e⁻</text><text x="410" y="207">6 e⁻</text><text x="410" y="157">6 e⁻</text><text x="410" y="107">2 e⁻</text><text x="85" y="370" font-size="17">occupancy before removal; ΔE after vacancy / före och efter hål</text></g></svg>
