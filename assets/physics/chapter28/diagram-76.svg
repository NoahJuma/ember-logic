<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A rotating charged cylindrical shell</title><desc id="desc">A cylindrical shell of radius R and length W rotates about the horizontal x axis. A narrow circular strip of width dx is highlighted.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M175 105H585V345H175Z" fill="#efc8c4" fill-opacity="0.7" stroke="#536b67" stroke-width="2"/><ellipse cx="175" cy="225" rx="45" ry="120" fill="#f2d2ce" stroke="#536b67" stroke-width="2"/><ellipse cx="585" cy="225" rx="45" ry="120" fill="#f2d2ce" stroke="#536b67" stroke-width="2"/><ellipse cx="480" cy="225" rx="30" ry="120" fill="#d98b8b" fill-opacity="0.5" stroke="#536b67" stroke-width="2"/><path d="M80 225H680 M175 65H585 M175 57V73 M585 57V73" fill="none" stroke="#536b67" stroke-width="2"/><path d="M220 135Q250 180 245 270" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="360" y="55">W</text><text x="635" y="232">x</text><text x="575" y="165">R</text><text x="445" y="385">dx</text><text x="240" y="260">ω</text><text x="300" y="200">Q</text></g></svg>