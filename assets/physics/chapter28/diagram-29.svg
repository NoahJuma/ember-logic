<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Two parallel wires with opposite currents</title><desc id="desc">Two long horizontal wires are separated by 0.400 metres. Current in the upper wire goes right and in the lower wire goes left.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M150 140H610 M150 305H610" fill="none" stroke="#bb8749" stroke-width="12"/><path d="M220 115H470" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M530 330H280" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M390 140V305 M380 140H400 M380 305H400" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="240" y="95">I₁ = 5.00 A</text><text x="370" y="235">0.400 m</text><text x="300" y="370">I₂ = 2.00 A</text></g></svg>