<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Wire field superposed with a uniform field</title><desc id="desc">In the xz plane, a long wire at the origin carries current in the negative y direction, out of the page. The uniform field points along positive x.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M100 240H650 M350 390V55" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="350" cy="240" r="17" fill="none" stroke="#536b67" stroke-width="2"/><circle cx="350" cy="240" r="5" fill="#263f3b"/><path d="M380 205H520" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><circle cx="350" cy="90" r="5" fill="#263f3b"/><circle cx="530" cy="240" r="5" fill="#263f3b"/><circle cx="350" cy="277.5" r="5" fill="#263f3b"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="660" y="247">x</text><text x="360" y="57">z</text><text x="370" y="265">I: −y (⊙)</text><text x="440" y="193">B₀</text><text x="364" y="90">1.00 m</text><text x="525" y="272">1.00 m</text><text x="365" y="304">−0.25 m</text></g></svg>