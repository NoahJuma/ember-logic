<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">Two parallel wires with an unknown battery polarity</title><desc id="desc">A battery with terminals a and b and an open switch powers a rectangular circuit. Its lower segment L lies above a separate straight wire whose current points left.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="350" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="23" fill="#263f40" stroke="#315b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M120 85H225 M375 85H460 M490 85H580V205H120V85 M120 260H580" fill="none"/><rect x="225" y="66" width="150" height="38" rx="7" fill="#dfece5"/><circle cx="460" cy="85" r="3"/><circle cx="490" cy="85" r="3"/><path d="M460 85l25 -15" fill="none" marker-end="url(#arrow)"/><path d="M430 295H290" fill="none" marker-end="url(#arrow)"/><g stroke="none"><text x="208" y="60">a</text><text x="375" y="60">b</text><text x="473" y="125">S</text><text x="345" y="195">L</text><text x="350" y="325">I</text></g></g></svg>
