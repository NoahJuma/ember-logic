<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Repelling horizontal wires</title><desc id="desc">An upper wire can slide vertically along guides above a lower fixed wire. The equal currents point in opposite directions, and their separation is h.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M150 145H610 M150 315H610" fill="none" stroke="#bb8749" stroke-width="12"/><path d="M500 120H260" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M220 340H460" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M300 110V300 M450 110V300 M370 145V315 M360 145H380 M360 315H380" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="335" y="95">I</text><text x="335" y="385">I</text><text x="380" y="235">h</text><text x="240" y="140">λ</text></g></svg>