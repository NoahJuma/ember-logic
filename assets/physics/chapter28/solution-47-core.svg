<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">Solenoid field and magnetization</title><desc id="desc">A schematic solenoid containing a core, with B naught, magnetization M and total magnetic field B all pointing right.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#17657a"/></marker></defs>
<rect width="800" height="340" rx="20" fill="#f8faf8"/><rect x="150" y="95" width="500" height="150" rx="60" fill="#d7e5e1" stroke="#63857e" stroke-width="3"/>
<g fill="none" stroke="#b36e32" stroke-width="5"><ellipse cx="200" cy="170" rx="34" ry="100"/><ellipse cx="270" cy="170" rx="34" ry="100"/><ellipse cx="340" cy="170" rx="34" ry="100"/><ellipse cx="410" cy="170" rx="34" ry="100"/><ellipse cx="480" cy="170" rx="34" ry="100"/><ellipse cx="550" cy="170" rx="34" ry="100"/><ellipse cx="620" cy="170" rx="34" ry="100"/></g>
<g fill="none" stroke="#17657a" stroke-width="5" marker-end="url(#arrow)"><path d="M260 135 H540"/><path d="M260 170 H540"/><path d="M260 205 H540"/></g><g fill="#173d47" font-family="sans-serif" font-size="24" font-weight="bold"><text x="220" y="142">B₀</text><text x="220" y="178">M</text><text x="220" y="213">B</text></g><text x="400" y="312" text-anchor="middle" fill="#495b57" font-family="sans-serif" font-size="20">B₀ ∥ M ∥ B</text></svg>