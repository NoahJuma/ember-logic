<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Two suspended wires connected to a charged capacitor</title><desc id="desc">Two parallel horizontal wires are suspended by cords. Their far ends are joined by a slack conductor and their near ends connect to opposite capacitor plates.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M150 95H620 M270 95V200 M440 95V240" fill="none" stroke="#536b67" stroke-width="2"/><path d="M150 210L470 175 M220 270L540 235" fill="none" stroke="#bb8749" stroke-width="10"/><path d="M470 175Q600 160 610 200Q600 230 540 235" fill="none" stroke="#536b67" stroke-width="2"/><path d="M150 210L135 320H185 M220 270L235 340H205" fill="none" stroke="#536b67" stroke-width="2"/><path d="M185 300V355 M205 310V345" fill="none" stroke="#536b67" stroke-width="2"/><path d="M270 200L270 197 M440 240L440 230" fill="none" stroke="#536b67" stroke-width="2"/><path d="M400 183V250 M392 183H408 M392 250H408" fill="none" stroke="#536b67" stroke-width="2"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="410" y="220">d</text><text x="165" y="375">C</text><text x="125" y="300">+</text><text x="222" y="320">−</text><text x="300" y="170">λ</text></g></svg>