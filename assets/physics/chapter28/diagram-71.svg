<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">A rotating charged cylinder and tilted disk</title><desc id="desc">A charged cylindrical shell rotates about its vertical axis; a smaller charged disk inside is tilted at an angle theta to that axis.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad488b"/></marker></defs><rect width="760" height="450" fill="#fffdf7"/><path d="M190 110Q380 40 570 110V340Q380 405 190 340Z" fill="#f4e4b8" fill-opacity="0.75" stroke="#536b67" stroke-width="2"/><ellipse cx="380" cy="110" rx="190" ry="55" fill="none" stroke="#536b67" stroke-width="2"/><ellipse cx="380" cy="340" rx="190" ry="55" fill="none" stroke="#536b67" stroke-width="2"/><ellipse cx="385" cy="245" rx="78" ry="25" transform="rotate(-25 385 245)" fill="#e5a3a3" stroke="#536b67" stroke-width="2"/><path d="M380 50V400" fill="none" stroke="#536b67" stroke-width="2" stroke-dasharray="7 5"/><path d="M450 100Q505 112 530 145" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><path d="M340 260Q390 285 425 225" fill="none" stroke="#ad488b" stroke-width="4" marker-end="url(#a)"/><g font-family="sans-serif" font-size="19" fill="#263f3b"><text x="205" y="225">Q₁, H, R₁</text><text x="365" y="230">Q₂, M, R₂</text><text x="535" y="145">ω₁</text><text x="430" y="240">ω₂</text><text x="400" y="175">θ</text></g></svg>