<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc"><title id="title">Charged rotating disk divided into rings</title><desc id="desc">A top view of a uniformly positively charged disk of radius a, with a thin ring at radius r. The example arrow shows counterclockwise rotation viewed from above.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315b60"/></marker></defs><rect width="700" height="420" rx="14" fill="#fbf8f1"/><g font-family="Arial,sans-serif" font-size="21" fill="#263f40" stroke="#315b60" stroke-width="2" stroke-linecap="round"><circle cx="300" cy="220" r="150" fill="#e2eee7"/><circle cx="300" cy="220" r="75" fill="none" stroke="#c4564c" stroke-width="5"/><circle cx="300" cy="220" r="79" fill="none" stroke="#c4564c" stroke-width="1"/><path d="M300 220H450" fill="none" marker-end="url(#arrow)"/><path d="M300 220L247 167" fill="none" marker-end="url(#arrow)"/><path d="M455 205A156 156 0 0 0 350 73" fill="none" marker-end="url(#arrow)"/><circle cx="300" cy="220" r="3" fill="#315b60"/><g stroke="none"><text x="375" y="211">a</text><text x="249" y="207">r</text><text x="480" y="143">n</text><text x="485" y="270">+Q</text><text x="276" y="113">+</text><text x="185" y="226">+</text><text x="282" y="342">+</text><text x="395" y="260">+</text><text x="470" y="360" font-size="17">top view / ovanifrån</text></g></g></svg>
