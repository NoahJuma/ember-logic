<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc"><title id="title">Angular velocity and acceleration versus time</title><desc id="desc">Angular velocity rises from zero to a positive maximum at 2 seconds, falls through zero at 4 seconds and is negative afterward. Angular acceleration declines linearly through zero at 2 seconds.</desc><rect width="520" height="270" fill="#fff"/><path d="M50 130H475M50 15V250" stroke="#333" stroke-width="2"/><path d="M50 130Q190 58 330 130Q400 166 470 238" fill="none" stroke="#21855a" stroke-width="4"/><path d="M50 74L470 242" fill="none" stroke="#c35c2d" stroke-width="4"/><g font-family="sans-serif" font-size="18" fill="#26352e"><text x="465" y="120">t (s)</text><text x="43" y="150">0</text><text x="181" y="150">2</text><text x="322" y="150">4</text><text x="460" y="150">6</text><text x="178" y="84" fill="#21855a">ω</text><text x="82" y="78" fill="#c35c2d">α</text></g><g stroke="#333"><path d="M190 125V135M330 125V135M470 125V135"/></g></svg>
