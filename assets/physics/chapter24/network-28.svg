<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">Two capacitors, 150 nanofarads and 120 nanofarads, in series between a and b.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H202 M218 170 H442 M458 170 H635"/><path d="M202 153 v34 M218 153 v34" class="cap"/><path d="M442 153 v34 M458 153 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="210" y="140" text-anchor="middle">150 nF</text><text x="450" y="140" text-anchor="middle">120 nF</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="635" cy="170" r="4" fill="#263d42" stroke="none"/><text x="635" y="201" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>