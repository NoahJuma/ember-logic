<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">C1 and C2 in series between a and d, in parallel with C3; C4 connects d to b.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H160 V90 H222 M238 90 H342 M358 90 H440 V250 H288 M272 250 H160 V170 M440 170 H505 V250 H562 M578 250 H635"/><path d="M222 73 v34 M238 73 v34" class="cap"/><path d="M342 73 v34 M358 73 v34" class="cap"/><path d="M272 233 v34 M288 233 v34" class="cap"/><path d="M562 233 v34 M578 233 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="230" y="60" text-anchor="middle">C₁</text><text x="350" y="60" text-anchor="middle">C₂</text><text x="280" y="290" text-anchor="middle">C₃</text><text x="570" y="290" text-anchor="middle">C₄</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="505" cy="170" r="4" fill="#263d42" stroke="none"/><text x="530" y="180" text-anchor="middle">d</text><circle cx="635" cy="250" r="4" fill="#263d42" stroke="none"/><text x="635" y="281" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>