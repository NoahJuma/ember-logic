<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">Two capacitors, 35 nanofarads and 75 nanofarads, in parallel between a and b.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H160 V90 H322 M338 90 H500 V250 H338 M322 250 H160 V170 M500 170 H635"/><path d="M322 73 v34 M338 73 v34" class="cap"/><path d="M322 233 v34 M338 233 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="330" y="60" text-anchor="middle">35 nF</text><text x="330" y="290" text-anchor="middle">75 nF</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="635" cy="170" r="4" fill="#263d42" stroke="none"/><text x="635" y="201" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>