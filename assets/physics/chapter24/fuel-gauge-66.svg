<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t d"><title id="t">Fuel-level capacitor</title><desc id="d">Two vertical plates of height L and width w sit in a tank; fuel of dielectric constant κ fills height h between them and air occupies the remaining height. A battery maintains voltage V.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><path d="M155 80 V275 H440 V80" fill="#fff" stroke="#527477" stroke-width="3"/><rect x="158" y="175" width="279" height="97" fill="#c2dcd0"/><path d="M220 100 V257 M370 100 V257" stroke="#b38428" stroke-width="12"/><path d="M220 100 V53 H270 M370 100 V53 H325 M270 37 V69 M325 44 V62" fill="none" stroke="#243f42" stroke-width="3"/><path d="M465 100 V257 M457 100 H473 M457 257 H473 M490 175 V257 M482 175 H498 M482 257 H498" fill="none" stroke="#243f42" stroke-width="2"/><g font-family="system-ui,sans-serif" font-size="21" fill="#20383b"><text x="290" y="36">V</text><text x="478" y="160">L</text><text x="502" y="220">h</text><text x="275" y="145">κ = 1</text><text x="280" y="224">κ</text><text x="185" y="310">w: ⊗</text></g></svg>
