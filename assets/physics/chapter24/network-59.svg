<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor ladder</title><desc id="desc">Two rails each contain three C1 capacitors in series. Corresponding nodes are joined by C2, C2 and C1, respectively. Nodes c and d are the second pair.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round"><path d="M40 90 H112 M128 90 H272 M288 90 H432 M448 90 H560 V162 M560 178 V250 H448 M432 250 H288 M272 250 H128 M112 250 H40 M200 90 V162 M200 178 V250 M360 90 V162 M360 178 V250"/><path stroke="#b28225" stroke-width="5" d="M112 73 V107 M128 73 V107 M272 73 V107 M288 73 V107 M432 73 V107 M448 73 V107 M112 233 V267 M128 233 V267 M272 233 V267 M288 233 V267 M432 233 V267 M448 233 V267 M183 162 H217 M183 178 H217 M343 162 H377 M343 178 H377 M543 162 H577 M543 178 H577"/></g><g fill="#263d42" font-family="sans-serif" font-size="20" text-anchor="middle"><text x="120" y="60">C₁</text><text x="280" y="60">C₁</text><text x="440" y="60">C₁</text><text x="120" y="290">C₁</text><text x="280" y="290">C₁</text><text x="440" y="290">C₁</text><text x="235" y="176">C₂</text><text x="395" y="176">C₂</text><text x="595" y="176">C₁</text><circle cx="40" cy="90" r="4"/><circle cx="40" cy="250" r="4"/><circle cx="360" cy="90" r="4"/><circle cx="360" cy="250" r="4"/><text x="40" y="120">a</text><text x="40" y="280">b</text><text x="360" y="60">c</text><text x="360" y="290">d</text></g></svg>
