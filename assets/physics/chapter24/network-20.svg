<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">C1 and C2 connected in parallel between a and d, with C3 connected between d and b.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H160 V90 H292 M308 90 H440 V250 H308 M292 250 H160 V170 M440 170 H500 V250 H562 M578 250 H635"/><path d="M292 73 v34 M308 73 v34" class="cap"/><path d="M292 233 v34 M308 233 v34" class="cap"/><path d="M562 233 v34 M578 233 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="300" y="60" text-anchor="middle">C₁</text><text x="300" y="290" text-anchor="middle">C₂</text><text x="570" y="290" text-anchor="middle">C₃</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="500" cy="170" r="4" fill="#263d42" stroke="none"/><text x="525" y="180" text-anchor="middle">d</text><circle cx="635" cy="250" r="4" fill="#263d42" stroke="none"/><text x="635" y="281" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>