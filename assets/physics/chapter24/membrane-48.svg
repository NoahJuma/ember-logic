<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d"><title id="t">Cell membrane as a capacitor</title><desc id="d">A cell membrane of thickness 7.5 nm separates positive charge on the outside from negative charge on the inside; its dielectric constant is about 10.</desc><rect width="640" height="260" rx="16" fill="#f4f7f4"/><rect x="120" y="90" width="400" height="80" fill="#c6dbd0" stroke="#61877b" stroke-width="2"/><path d="M535 90 H555 M535 170 H555 M547 90 V170" fill="none" stroke="#294547" stroke-width="2"/><g font-family="system-ui,sans-serif" font-size="22" fill="#20383b"><text x="141" y="73">+　+　+　+　+　+　+　+</text><text x="141" y="200">−　−　−　−　−　−　−　−</text><text x="295" y="139">κ ≈ 10</text><text x="560" y="138">7.5 nm</text></g></svg>
