<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d"><title id="t">Two capacitors in series</title><desc id="d">Capacitors C₁ and C₂ are in series between terminals a and b. Vₐᵦ is positive.</desc><rect width="640" height="220" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#294547" stroke-width="4"><path d="M70 110 H170 M190 110 H350 M370 110 H560 M170 80 V140 M190 80 V140 M350 80 V140 M370 80 V140"/></g><g font-family="system-ui,sans-serif" font-size="22" fill="#20383b"><text x="58" y="150">a</text><text x="555" y="150">b</text><text x="165" y="63">C₁</text><text x="345" y="63">C₂</text><text x="235" y="190">V<tspan baseline-shift="sub" font-size="15">ab</tspan> &gt; 0</text></g></svg>
