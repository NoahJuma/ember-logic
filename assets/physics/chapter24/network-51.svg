<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">8.60 and 4.80 microfarads in series, followed by parallel branches of 6.20 and 11.8 microfarads in series, and 3.50 microfarads.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M35 170 H82 M98 170 H172 M188 170 H230 V90 H292 M308 90 H402 M418 90 H500 V250 H368 M352 250 H230 V170 M500 170 H640"/><path d="M82 153 v34 M98 153 v34" class="cap"/><path d="M172 153 v34 M188 153 v34" class="cap"/><path d="M292 73 v34 M308 73 v34" class="cap"/><path d="M402 73 v34 M418 73 v34" class="cap"/><path d="M352 233 v34 M368 233 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="90" y="140" text-anchor="middle">8.60 μF</text><text x="180" y="205" text-anchor="middle">4.80 μF</text><text x="300" y="60" text-anchor="middle">6.20 μF</text><text x="410" y="60" text-anchor="middle">11.8 μF</text><text x="360" y="290" text-anchor="middle">3.50 μF</text><circle cx="35" cy="170" r="4" fill="#263d42" stroke="none"/><text x="35" y="201" text-anchor="middle">a</text><circle cx="640" cy="170" r="4" fill="#263d42" stroke="none"/><text x="640" y="201" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>