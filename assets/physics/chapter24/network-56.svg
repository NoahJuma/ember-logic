<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">Two parallel series branches across a and b. Top branch has 3.00 and 6.00 microfarads with midpoint d. Bottom branch has 6.00 and 3.00 microfarads with midpoint c. An open switch connects the midpoints.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M35 170 H125 V85 H202 M218 85 H330 H432 M448 85 H555 V255 H448 M432 255 H330 H218 M202 255 H125 V170 M555 170 H640 M330 85 V135 M330 205 V255 M330 135 L346 190"/><path d="M202 68 v34 M218 68 v34" class="cap"/><path d="M432 68 v34 M448 68 v34" class="cap"/><path d="M202 238 v34 M218 238 v34" class="cap"/><path d="M432 238 v34 M448 238 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="210" y="55" text-anchor="middle">3.00 μF</text><text x="440" y="55" text-anchor="middle">6.00 μF</text><text x="210" y="295" text-anchor="middle">6.00 μF</text><text x="440" y="295" text-anchor="middle">3.00 μF</text><text x="363" y="172" text-anchor="middle">S</text><circle cx="35" cy="170" r="4" fill="#263d42" stroke="none"/><text x="35" y="201" text-anchor="middle">a</text><circle cx="640" cy="170" r="4" fill="#263d42" stroke="none"/><text x="640" y="201" text-anchor="middle">b</text><circle cx="330" cy="85" r="4" fill="#263d42" stroke="none"/><text x="355" y="98" text-anchor="middle">d</text><circle cx="330" cy="255" r="4" fill="#263d42" stroke="none"/><text x="355" y="270" text-anchor="middle">c</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>