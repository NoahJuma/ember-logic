<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">10.0 microfarads in series with the parallel combination of 5.0 and 8.0 microfarads, then 9.0 microfarads.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H102 M118 170 H200 V90 H292 M308 90 H430 V250 H308 M292 250 H200 V170 M430 170 H512 M528 170 H635"/><path d="M102 153 v34 M118 153 v34" class="cap"/><path d="M292 73 v34 M308 73 v34" class="cap"/><path d="M292 233 v34 M308 233 v34" class="cap"/><path d="M512 153 v34 M528 153 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="110" y="140" text-anchor="middle">10.0 μF</text><text x="300" y="60" text-anchor="middle">5.0 μF</text><text x="300" y="290" text-anchor="middle">8.0 μF</text><text x="520" y="140" text-anchor="middle">9.0 μF</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="635" cy="170" r="4" fill="#263d42" stroke="none"/><text x="635" y="201" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>