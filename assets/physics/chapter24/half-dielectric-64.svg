<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="title desc"><title id="title">Capacitor half filled by dielectric</title><desc id="desc">A dielectric fills one half of the plate area, and air fills the other half. Both regions extend across the full plate separation.</desc><rect width="640" height="310" rx="16" fill="#f4f7f4"/><rect x="110" y="74" width="210" height="160" fill="#cededb"/><rect x="320" y="74" width="210" height="160" fill="#fff"/><g fill="#e1b856" stroke="#956e20" stroke-width="3"><rect x="110" y="55" width="420" height="16"/><rect x="110" y="239" width="420" height="16"/></g><g font-family="sans-serif" font-size="25" fill="#183239" text-anchor="middle"><text x="215" y="162">κ = 3.40</text><text x="425" y="162">κ ≈ 1</text><text x="320" y="42">12.0 cm</text></g></svg>
