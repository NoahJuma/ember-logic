<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">15 picofarads between a and b; 9.0 and 11 picofarads connected in parallel between b and c.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H132 M148 170 H230 V90 H322 M338 90 H500 V250 H338 M322 250 H230 V170 M500 170 H635"/><path d="M132 153 v34 M148 153 v34" class="cap"/><path d="M322 73 v34 M338 73 v34" class="cap"/><path d="M322 233 v34 M338 233 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="140" y="140" text-anchor="middle">15 pF</text><text x="330" y="60" text-anchor="middle">9.0 pF</text><text x="330" y="290" text-anchor="middle">11 pF</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="230" cy="170" r="4" fill="#263d42" stroke="none"/><text x="255" y="180" text-anchor="middle">b</text><circle cx="635" cy="170" r="4" fill="#263d42" stroke="none"/><text x="635" y="201" text-anchor="middle">c</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>