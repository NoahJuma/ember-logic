<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">Capacitor network</title><desc id="desc">Three branches between a and b: 7.5 nanofarads on top, 18.0, 30.0 and 10.0 nanofarads in series in the middle, and 6.5 nanofarads on the bottom.</desc><rect width="680" height="340" rx="16" fill="#f4f7f4"/><g fill="none" stroke="#263d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 170 H130 V70 H322 M338 70 H550 V270 H338 M322 270 H130 V170 M130 170 H202 M218 170 H322 M338 170 H442 M458 170 H550 H635"/><path d="M322 53 v34 M338 53 v34" class="cap"/><path d="M202 153 v34 M218 153 v34" class="cap"/><path d="M322 153 v34 M338 153 v34" class="cap"/><path d="M442 153 v34 M458 153 v34" class="cap"/><path d="M322 253 v34 M338 253 v34" class="cap"/></g><g fill="#263d42" font-family="sans-serif" font-size="20"><text x="330" y="40" text-anchor="middle">7.5 nF</text><text x="210" y="140" text-anchor="middle">18.0 nF</text><text x="330" y="140" text-anchor="middle">30.0 nF</text><text x="450" y="140" text-anchor="middle">10.0 nF</text><text x="330" y="310" text-anchor="middle">6.5 nF</text><circle cx="45" cy="170" r="4" fill="#263d42" stroke="none"/><text x="45" y="201" text-anchor="middle">a</text><circle cx="635" cy="170" r="4" fill="#263d42" stroke="none"/><text x="635" y="201" text-anchor="middle">b</text></g><style>.cap{stroke:#b28225;stroke-width:5}</style></svg>