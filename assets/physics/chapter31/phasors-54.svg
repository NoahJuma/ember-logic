<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img">
<title>Parallel RLC current phasors</title>
<desc>Two possible phasor diagrams with voltage and resistor current to the right, capacitor current upward, inductor current downward and resultant current pointing above or below the horizontal.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#176987"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b84e27"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6c4f89"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#407955"/></marker></defs>
<rect width="900" height="330" fill="#fff"/><g font-family="Arial, sans-serif" font-size="20" fill="#24383c">
<text x="30" y="30">I_C &gt; I_L</text><text x="478" y="30">I_L &gt; I_C</text>
<g stroke-width="3.5" fill="none"><path d="M 80 170 H 320" stroke="#176987" marker-end="url(#blue)"/><path d="M 530 170 H 770" stroke="#176987" marker-end="url(#blue)"/><path d="M 80 170 V 60" stroke="#b84e27" marker-end="url(#orange)"/><path d="M 530 170 V 115" stroke="#b84e27" marker-end="url(#orange)"/><path d="M 80 170 V 220" stroke="#407955" marker-end="url(#green)"/><path d="M 530 170 V 280" stroke="#407955" marker-end="url(#green)"/><path d="M 80 170 L 320 110" stroke="#6c4f89" marker-end="url(#purple)"/><path d="M 530 170 L 770 230" stroke="#6c4f89" marker-end="url(#purple)"/><path d="M 320 170 V 110 M 770 170 V 230" stroke="#819397" stroke-dasharray="5 5"/></g>
<text x="255" y="195">V, I_R</text><text x="704" y="195">V, I_R</text><text x="91" y="72">I_C</text><text x="541" y="125">I_C</text><text x="91" y="239">I_L</text><text x="541" y="299">I_L</text><text x="323" y="108">I</text><text x="775" y="235">I</text>
</g></svg>
