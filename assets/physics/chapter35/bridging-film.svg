<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Oil film on seawater at near-normal incidence</title><desc id="desc">Air lies above an oil film of refractive index 1.45 and thickness 380 nanometres; seawater of refractive index 1.33 lies below. The air-to-oil reflection reverses phase and the oil-to-water reflection does not.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="700" height="400" rx="14" fill="#fbf8f1"/><rect x="70" y="145" width="560" height="100" fill="#f2dca5"/><rect x="70" y="245" width="560" height="110" fill="#dcecf2"/><g font-family="Arial,sans-serif" font-size="20" fill="#263f40" stroke-linecap="round" stroke-linejoin="round"><path d="M70 145H630 M70 245H630" fill="none" stroke="#315b60" stroke-width="2"/><path d="M180 60L230 145" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 145L280 60" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 145L290 245L350 145L400 60" fill="none" stroke="#a45284" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 150V240" fill="none" stroke="#315b60" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="110">air / luft</text><text x="430" y="185">oil / olja</text><text x="430" y="212">n = 1.45</text><text x="430" y="285">water / vatten</text><text x="430" y="312">n = 1.33</text><text x="565" y="205">380 nm</text><text x="80" y="380" font-size="17">ray separation exaggerated / strålarna isärdragna</text></g></svg>
