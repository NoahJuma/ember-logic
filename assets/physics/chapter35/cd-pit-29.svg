<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" role="img"><title>Compact disc pit</title><desc>Light travels upward through plastic and reflects from the flat coating and a recessed pit; the flat-region ray travels twice the depth farther.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="650" height="300" fill="#fffdf8"/><path d="M60 90H590V250H60Z" fill="#f7e7c4"/><path d="M60 90H240V125H350V90H590" fill="none" stroke="#33515c" stroke-width="6"/><path d="M145 235V95" fill="none" stroke="#c55534" stroke-width="4" marker-end="url(#arrow)"/><path d="M175 95V235" fill="none" stroke="#c55534" stroke-width="4" marker-end="url(#arrow)"/><path d="M275 235V130" fill="none" stroke="#754a90" stroke-width="4" marker-end="url(#arrow)"/><path d="M305 130V235" fill="none" stroke="#754a90" stroke-width="4" marker-end="url(#arrow)"/><path d="M385 90V125M377 90H393M377 125H393" stroke="#444" stroke-width="2"/><text x="398" y="115" font-family="sans-serif" font-size="19">h</text><text x="430" y="220" font-family="sans-serif" font-size="19">n = 1.8</text></svg>
