<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img"><title>Waveguide ray paths</title><desc>An axial direct path and a path reflected once from the wall connect the source to a point on the axis of a cylindrical tube.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="680" height="400" fill="#fffdf8"/><rect x="95" y="100" width="500" height="200" rx="60" fill="#eef6f4" stroke="#476c70" stroke-width="3"/><path d="M130.00 200.00L550.00 200.00" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="7 5" /><circle cx="135.00" cy="200.00" r="5" fill="#b53c68"/><circle cx="430.00" cy="200.00" r="5" fill="#b53c68"/><path d="M135.00 200.00L430.00 200.00" fill="none" stroke="#347c55" stroke-width="3"  marker-end="url(#arrow)"/><path d="M135.00 200.00L282.50 100.00" fill="none" stroke="#b53c68" stroke-width="3"  /><path d="M282.50 100.00L430.00 200.00" fill="none" stroke="#b53c68" stroke-width="3"  marker-end="url(#arrow)"/><text x="120" y="230" font-family="sans-serif" font-size="18" fill="#333">S</text><text x="435" y="230" font-family="sans-serif" font-size="18" fill="#333">P</text><text x="275" y="335" font-family="sans-serif" font-size="18" fill="#333">d</text><text x="100" y="155" font-family="sans-serif" font-size="18" fill="#333">r</text></svg>