<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="title desc"><title id="title">Fresnel biprism geometry</title><desc id="desc">A source S zero shines through two halves of a thin biprism. Backward extensions of the refracted rays meet at virtual sources S one and S two, separated by d. The prism lies distance a from the source plane and the screen distance b beyond the prism.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="700" height="380" rx="18" fill="#f4f8f7"/>
<path d="M300 75 L325 180 L300 285 Z" fill="#d1e5e1" stroke="#49766f" stroke-width="2"/><path d="M300 180 H325" stroke="#49766f" stroke-width="1"/><path d="M600 65 V295" stroke="#304b50" stroke-width="6"/><path d="M100 180 H600" stroke="#8a9893" stroke-width="2" stroke-dasharray="6 6"/>
<g stroke="#1d6d78" stroke-width="3" fill="none"><path d="M100 180 L300 150 L600 180"/><path d="M100 180 L300 210 L600 180"/></g><g stroke="#1d6d78" stroke-width="2" fill="none" stroke-dasharray="6 5"><path d="M100 130 L300 150"/><path d="M100 230 L300 210"/></g>
<circle cx="100" cy="130" r="6" fill="#b95d35"/><circle cx="100" cy="180" r="7" fill="#263f43"/><circle cx="100" cy="230" r="6" fill="#b95d35"/><circle cx="600" cy="180" r="6" fill="#263f43"/>
<g stroke="#6f807a" stroke-width="2" fill="none"><path d="M55 130 V230 M48 130 H62 M48 230 H62 M100 320 H300 M100 313 V327 M300 313 V327 M300 320 H600 M600 313 V327"/></g>
<g font-family="Arial,sans-serif" font-size="22" fill="#263f43"><text x="70" y="120">S₁</text><text x="70" y="178">S₀</text><text x="70" y="251">S₂</text><text x="34" y="185">d</text><text x="190" y="350">a</text><text x="442" y="350">b</text><text x="610" y="185">O</text><text x="325" y="90">A</text><text x="325" y="290">A</text></g>
</svg>
