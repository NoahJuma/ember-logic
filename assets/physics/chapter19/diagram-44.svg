<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Helium p–V paths</title><desc id="desc">The path a to b to c consists of two straight lines; a dashed constant-pressure path runs directly from a to c.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="150" y="300">a</text><text x="340" y="98">b</text><text x="540" y="300">c</text><text x="127" y="377">0.002</text><text x="325" y="377">0.006</text><text x="515" y="377">0.010 m³</text><text x="5" y="284">1.0×10⁵</text><text x="5" y="109">3.5×10⁵</text><text x="95" y="52">Pa</text></g><path d="M180 280L360 105" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M360 105L540 280" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M180 280H540" fill="none" stroke="#08788a" stroke-width="4" stroke-dasharray="7 5"/><circle cx="180" cy="280" r="5" fill="#253c3d"/><circle cx="360" cy="105" r="5" fill="#253c3d"/><circle cx="540" cy="280" r="5" fill="#253c3d"/></svg>