<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">A rectangular cyclic p–V path</title><desc id="desc">States 1 and 3 are at the higher pressure; states 4 and 2 are at the lower pressure. The cyclic path travels from 1 to 3 to 2 to 4 to 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="155" y="80">1</text><text x="525" y="80">3</text><text x="525" y="285">2</text><text x="155" y="285">4</text><text x="46" y="106">p₁</text><text x="46" y="268">p₂</text><text x="165" y="376">V₁</text><text x="523" y="376">V₂</text></g><path d="M180 100H540V260H180Z" fill="none" stroke="#08788a" stroke-width="4"/><circle cx="180" cy="100" r="5" fill="#253c3d"/><circle cx="540" cy="100" r="5" fill="#253c3d"/><circle cx="540" cy="260" r="5" fill="#253c3d"/><circle cx="180" cy="260" r="5" fill="#253c3d"/></svg>