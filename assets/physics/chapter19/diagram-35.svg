<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Straight pressure-volume path</title><desc id="desc">The gas moves from a to b along a straight line; both pressure and volume increase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="170" y="255">a</text><text x="520" y="115">b</text><text x="160" y="380">Vₐ</text><text x="520" y="380">Vᵦ</text><text x="40" y="260">pₐ</text><text x="40" y="145">pᵦ</text></g><path d="M200 250L530 140" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="200" cy="250" r="5" fill="#253c3d"/><circle cx="530" cy="140" r="5" fill="#253c3d"/></svg>