<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Three thermodynamic paths</title><desc id="desc">Path a to c to b goes up then right; path a to d to b goes right then up; a curved path returns from b to a.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="170" y="310">a</text><text x="525" y="110">b</text><text x="170" y="110">c</text><text x="525" y="310">d</text></g><path d="M200 285V120" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 120H520" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 285H520" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 285V120" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 120C370 120 350 285 200 285" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="200" cy="285" r="5" fill="#253c3d"/><circle cx="200" cy="120" r="5" fill="#253c3d"/><circle cx="520" cy="120" r="5" fill="#253c3d"/><circle cx="520" cy="285" r="5" fill="#253c3d"/></svg>