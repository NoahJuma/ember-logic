<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Three paths between thermodynamic states</title><desc id="desc">Three paths join a to b. The upper path is 1, the straight middle path is 2, and the lower path is 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="143" y="297">a</text><text x="550" y="125">b</text><text x="270" y="90">1</text><text x="330" y="190">2</text><text x="330" y="285">3</text></g><path d="M180 270C155 100 370 25 540 130" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M180 270L540 130" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M180 270C310 350 330 255 430 240S515 190 540 130" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="180" cy="270" r="5" fill="#253c3d"/><circle cx="540" cy="130" r="5" fill="#253c3d"/></svg>