<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Air pressure–volume paths</title><desc id="desc">State a is at 0.020 cubic metres and 300000 pascals; b at the same volume and 100000 pascals; c at 0.060 cubic metres and 100000 pascals. A dashed straight line connects a to c.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="215" y="142">a</text><text x="215" y="300">b</text><text x="545" y="300">c</text><text x="222" y="377">0.02</text><text x="372" y="377">0.04</text><text x="522" y="377">0.06 m³</text><text x="12" y="144">3.0×10⁵</text><text x="12" y="284">1.0×10⁵</text><text x="95" y="52">Pa</text></g><path d="M240 140V280" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M240 280H540" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M240 140L540 280" fill="none" stroke="#08788a" stroke-width="4" stroke-dasharray="7 5"/><circle cx="240" cy="140" r="5" fill="#253c3d"/><circle cx="240" cy="280" r="5" fill="#253c3d"/><circle cx="540" cy="280" r="5" fill="#253c3d"/></svg>