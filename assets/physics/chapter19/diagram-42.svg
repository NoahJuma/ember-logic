<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">A gas cycle with an adiabatic segment</title><desc id="desc">The cycle goes right from a to c at constant pressure, curves up and left from c to b adiabatically, then descends from b to a at constant volume.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#08788a"/></marker></defs><rect width="700" height="430" fill="#fffdf7"/><path d="M90 60V350H650 M90 60l-5 10m5-10l5 10 M650 350l-10-5m10 5l-10 5" stroke="#344b4b" stroke-width="2" fill="none"/><g font-family="sans-serif" font-size="18" fill="#253c3d"><text x="66" y="65">p</text><text x="650" y="373">V</text><text x="155" y="291">a</text><text x="155" y="104">b</text><text x="537" y="291">c</text></g><path d="M180 270H520" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 270C430 250 245 210 180 100" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><path d="M180 100V270" fill="none" stroke="#08788a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="180" cy="270" r="5" fill="#253c3d"/><circle cx="180" cy="100" r="5" fill="#253c3d"/><circle cx="520" cy="270" r="5" fill="#253c3d"/></svg>