<body class="study"><header class="study-top"><a href="./" class="study-brand"><b>e.</b> Ember Study Labs</a><a href="physics-chapter2.html" id="back">← Kapitel 2</a><label>Language <select id="lang"><option value="sv">Svenska</option><option value="en">English</option></select></label></header>
<main class="study-wrap"><section class="study-hero"><p class="kicker">PHYSICS / CHAPTER 2 · WORK IN PROGRESS</p><h1 id="title">Rörelse längs <em>en linje.</em></h1><p id="intro">Utforska en modell med konstant acceleration.</p></section><section class="study-section"><div class="lab-grid"><div class="panel motion-graph"><h2 id="graph-title">Graf</h2><svg id="graph" viewBox="0 0 640 380" role="img"></svg><p id="graph-description" class="caption"></p></div><div class="panel"><h2 id="controls-title">Ändra rörelsen</h2><div class="motion-controls"><label><span id="x-label">Startläge x₀ (m)</span><input id="x0" type="number" step="1" min="-100" max="100" value="0"></label><label><span id="v-label">Starthastighet v₀ (m/s)</span><input id="v0" type="number" step="1" min="-30" max="30" value="4"></label><label><span id="a-label">Acceleration a (m/s²)</span><input id="acc" type="number" step="0.5" min="-10" max="10" value="-1"></label><label><span id="t-label">Tid t (s)</span><input id="time" type="range" min="0" max="10" step="0.1" value="2"><output id="time-value">2.0 s</output></label><label><span id="kind-label">Visa graf</span><select id="kind"><option value="x">x–t</option><option value="v">v–t</option><option value="a">a–t</option></select></label></div><p class="caption" id="assumption">Modellen förutsätter konstant acceleration under hela intervallet.</p><details id="prediction"><summary id="predict-title">Förutsäg innan grafen visas</summary><p id="predict-instruction"></p><label><span id="predict-label"></span><input id="predict-value" type="number" step="any"></label> <button class="secondary" id="predict-reveal" type="button">Visa resultat</button><p class="caption" id="predict-feedback" role="status"></p></details><div class="answer" id="result" role="status"></div><button class="secondary" id="reset" type="button">Återställ</button> <button class="secondary" id="fullscreen" type="button">Helskärm</button></div></div></section></main></body></html>
